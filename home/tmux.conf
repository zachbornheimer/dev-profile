# Chezmoi owns prefix-m. `mux setup-keybind` would overwrite this bind.
# Sleep lets the popup PTY report its size before Bubble Tea starts.
bind m display-popup -E -w 85% -h 80% "bash -lc 'sleep 0.15; exec /opt/homebrew/bin/mux popup'"

bind m display-popup -E -w 85% -h 80% "/Users/zbornheimer/.local/share/mise/installs/go/1.26.6/bin/mux"  # mux popup keybinding

# Grok TUI inside tmux (kitty): truecolor, OSC passthrough (cursor), CSI-u Shift+Enter.
set -g extended-keys on
set -as terminal-features ",*:RGB"
set -as terminal-features "xterm-kitty:RGB:extkeys"
set -wg allow-passthrough on
set -g set-clipboard on

set -g extended-keys-format csi-u
