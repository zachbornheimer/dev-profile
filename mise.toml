# Files on this branch are the source. mise dot apply installs them.
# hk/hk.pkl stays because hk reads Pkl. The generator does not.

min_version = "2026.10.0"

[env]
DEV_PROFILE_BACKUPS = "{{env.HOME}}/.local/state/dev-profile/backups"

[bootstrap.packages]
"brew:git" = "latest"

[tasks.setup]
description = "Seed the global mise config, apply the dotfiles, install the upstream skills, then set up omp (entrypoint + oh-my-pi main lock)"
# ~/.config/mise/config.toml is tracked in place (mode = "track"); seed it from config/mise.toml only when missing.
# Upstream skills are not committed; aubx-skills installs them from agents/available-skills/.skill-lock.json.
run = [
  "mkdir -p ~/.config/mise && [ -f ~/.config/mise/config.toml ] || cp config/mise.toml ~/.config/mise/config.toml",
  # A first apply has no fragment yet, so the clone is named once; after that profile/mise.toml carries the root.
  # A worktree run on a machine that is already set up leaves the live links on the main checkout.
  '[ -e ~/.config/mise/conf.d/dev-profile ] || export MISE_DOTFILES_ROOT="{{config_root}}"; mise dot apply --yes',
  "~/.agents/bin/aubx-skills sync",
  # Installs the stable omp entrypoint (~/.local/bin/omp -> the mise shim) and
  # the reference-transaction hook keeping oh-my-pi's main a read-only upstream mirror.
  "~/.local/share/dev-profile/bin/dev-profile-omp-machine-setup",
]

[tasks.doctor]
description = "Syntax-check the files this branch installs"
run = "bash tests/doctor.sh"

[tasks.fmt]
description = "Format this repo with the branch dprint config"
run = 'dprint fmt --config config/dprint.jsonc "**/*"'

[tasks.lint]
description = "Check formatting"
run = 'dprint check --config config/dprint.jsonc "**/*"'

[tasks.build]
description = "Nothing to render"
run = "mise run doctor"

[tasks.test]
description = "Check the installed files"
run = "mise run doctor"

[tasks."test:agent-checkpoints"]
description = "Exercise fail-closed checkpoint publication against signed scratch repositories"
run = "bun test apps/omp/extensions/agent-checkpoint-publish.test.ts"

[tasks."test:cd-latency"]
description = "Keep held renderers and deferred hooks off the interactive prompt path"
run = "zsh -f tests/cd-latency-fixture.zsh"

[tasks."test:adoption"]
description = "Deploy a clone at an arbitrary path into a scratch HOME with the real mise; the personal overlay stays opt-in"
run = "bash tests/adoption-fixture.sh"
[tasks."test:pre-push-upstream-merge"]
description = "Check wrapper and direct hk attribution of inherited merge files"
run = "bash tests/pre-push-upstream-merge.sh"

[tasks."test:foxguard-introduced"]
description = "Check the push gate reports only branch-introduced foxguard findings, with real foxguard"
run = 'bash tests/foxguard-introduced-fixture.sh "$(mktemp -d)"'

[tasks."test:kitty-tabs"]
description = "Render custom tab labels with the installed Kitty engine (no UI)"
run = "kitty +runpy \"import runpy; runpy.run_path('tests/kitty_tabs.py', run_name='__main__')\""

# The scope guard is a hook pair (tool.before + turn.stop) whose tests drive the real hook
# by path with a fake judge, so they need no network and no omp session.
[tasks."test:scope-guard"]
description = "Run the scope-guard hook tests"
run = "pytest agents/hooks/tests/test_scope_guard.py"

# Check tool import graphs and real extension registration without a model call.
# CI also exercises the validator against isolated healthy and broken modules.
[tasks."test:omp"]
description = "Check installed tool imports and host extension registration without model calls"
run = "bash tests/omp-tools-validate.sh"

[tasks."test:omp-fixture"]
description = "Exercise OMP health-check success and failure cases"
run = "bash tests/omp-tools-fixture.sh"

[tasks."list:skills:unmanaged"]
alias = ["list:skills:unamanaged", "skills:unmanaged"]
description = "List skills in ~/.agents/available-skills not tracked in .skill-lock.json"
run = "~/.agents/bin/aubx-skills unmanaged"
[tasks.ci]
description = "lint, then the file check"
run = ["mise run lint", "mise run test"]
