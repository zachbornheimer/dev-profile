[tasks.fmt]
description = "Format with dprint using the Personal ancestor config"
run = "dprint fmt"

[tasks.test]
description = "Run profile-selection and dogfood tests against live mise"
run = "go test ./..."

[tasks.install-profile]
description = "Install the personal overlay, dprint ancestor, and worktrunk config"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root="$(git rev-parse --show-toplevel)"

dest="${HOME}/Developer/Personal/mise.toml"
cp "${root}/profiles/personal.toml" "${dest}"
mise trust --yes "${dest}" || mise trust "${dest}"
echo "installed ${dest}"

dprint_dest="${HOME}/Developer/Personal/dprint.jsonc"
cp "${root}/format/personal.jsonc" "${dprint_dest}"
echo "installed ${dprint_dest}"

mkdir -p "${HOME}/.config/worktrunk"
wt_dest="${HOME}/.config/worktrunk/config.toml"
cp "${root}/worktrunk/config.toml" "${wt_dest}"
echo "installed ${wt_dest}"
'''
