# Files on this branch are the source. mise dot apply installs them.
# hk/hk.pkl stays because hk reads Pkl. The generator does not.

min_version = "2026.10.0"

[env]
DEV_PROFILE_BACKUPS = "{{env.HOME}}/.local/state/dev-profile/backups"

[bootstrap.packages]
"brew:git" = "latest"

[tasks.setup]
description = "Seed the global mise config and apply the dotfiles"
# ~/.config/mise/config.toml is tracked in place (mode = "track"); seed it from config/mise.toml only when missing.
run = [
  "mkdir -p ~/.config/mise && [ -f ~/.config/mise/config.toml ] || cp config/mise.toml ~/.config/mise/config.toml",
  # A first apply has no fragment yet, so the clone is named once; after that profile/mise.toml carries the root.
  # A worktree run on a machine that is already set up leaves the live links on the main checkout.
  '[ -e ~/.config/mise/conf.d/dev-profile ] || export MISE_DOTFILES_ROOT="{{config_root}}"; mise dot apply --yes',
]

[tasks."setup:personal"]
description = "The author's agent stack on top of setup: upstream skills, then the omp entrypoint"
depends = ["setup"]
# Upstream skills are not committed; aubx-skills installs them into ~/.agents/available-skills/ (tracked by mise dot, not this repo).
# dev-profile-omp-machine-setup installs only the stable omp entrypoint (~/.local/bin/omp -> the mise shim).
# Fork binaries install only through mise (`mise install` / `mise up`); the fork tool owns the per-clone hook and
# `fork doctor` is the layout check. `shipping-a-fork-binary-via-mise` owns the process.
run = [
  "~/.agents/bin/aubx-skills sync",
  "~/.local/share/dev-profile/bin/dev-profile-omp-machine-setup",
]

[tasks."test:done-native"]
description = "Prove explicit retirement through native Worktrunk aliases"
run = "bash tests/done-native-fixture.sh"

[tasks."test:native-aliases"]
description = "Exercise native sync and consolidated PR alias contracts"
run = "bash tests/native-alias-fixture.sh"
[tasks."test:done"]
description = "Exercise lossless native Worktrunk lifecycle and failure gates"
run = "bash tests/done-fixture.sh"
[tasks.doctor]
description = "Syntax-check the files this branch installs"
run = "bash tests/doctor.sh"

[tasks."test:dot-save-turn"]
description = "Prove bounded checkpoint provenance and real snapshot reporting"
run = ["python3 tests/dot-save-turn-history.py", "bash tests/dot-save-turn-fixture.sh"]
[tasks."test:owners"]
description = "Prove the owner list is one file an adopter replaces, and that repo-owned follows it"
run = "bash tests/owners-fixture.sh"

[tasks.fmt]
description = "Format this repo with the branch dprint config"
run = 'dprint fmt --config config/dprint.jsonc "**/*"'

[tasks.lint]
description = "Check formatting"
run = 'dprint check --config config/dprint.jsonc "**/*"'

[tasks."test:dprint-shell"]
description = "Check exact shell convergence, syntax, semantics and file dispatch"
run = "python3 tests/dprint-shell-fixture.py"

[tasks.build]
description = "Nothing to render"
run = "mise run doctor"

[tasks.test]
description = "Check the installed files, then the installed rule fixture gate"
run = ["mise run doctor", "mise run test:rules"]

[tasks."test:merge-conflicts"]
description = "Allow rerere preimages while rejecting source conflict markers"
run = "bash tests/merge-conflicts-fixture.sh"
[tasks."test:agent-checkpoints"]
description = "Exercise fail-closed checkpoint publication against signed scratch repositories"
run = "bun test apps/omp/extensions/agent-checkpoint-publish.test.ts"

[tasks."test:foreign-home-paths"]
description = "Check the push gate rejects an added absolute home path or symlink target and passes a relative one"
run = 'bash tests/foreign-home-paths-fixture.sh "$PWD"'

[tasks."test:cd-latency"]
description = "Keep held renderers and deferred hooks off the interactive prompt path"
run = "zsh -f tests/cd-latency-fixture.zsh"

[tasks."test:op-token-validation"]
description = "Count the 1Password calls an interactive shell start makes: none for a service token already validated, one for a changed, expired or refused one"
run = "zsh -f tests/op-token-validation-fixture.zsh"
[tasks."test:ai-keys-refusal"]
description = "Count the `op inject` runs shell starts make after 1Password refused the token and template: one per 15 minutes for a shell that cannot change the answer, every time for a Mac terminal shell"
run = "zsh -f tests/ai-keys-refusal-fixture.zsh"
[tasks."test:adoption"]
description = "Deploy a clone at an arbitrary path into a scratch HOME with the real mise; the personal overlay stays opt-in"
run = "bash tests/adoption-fixture.sh"
[tasks."test:pre-push-upstream-merge"]
description = "Check wrapper and direct hk attribution of inherited merge files"
run = "bash tests/pre-push-upstream-merge.sh"

[tasks."test:foxguard-introduced"]
description = "Check the push gate reports only branch-introduced foxguard findings, with real foxguard"
run = 'bash tests/foxguard-introduced-fixture.sh "$(mktemp -d)"'

[tasks."test:cargo-deny-introduced"]
description = "Check the push gate fails only on cargo-deny errors the branch introduces, with real cargo-deny"
run = "bash tests/cargo-deny-introduced-fixture.sh"

[tasks."test:gitleaks-pushed-range"]
description = "Check the push gate's gitleaks step scans the commits a push sends, not the checkout's HEAD, with real gitleaks"
run = "bash tests/gitleaks-pushed-range-fixture.sh"

[tasks."test:kitty-tabs"]
description = "Render custom tab labels with the installed Kitty engine (no UI)"
run = "kitty +runpy \"import runpy; runpy.run_path('tests/kitty_tabs.py', run_name='__main__')\""

# Check tool import graphs and real extension registration without a model call.
# CI also exercises the validator against isolated healthy and broken modules.
[tasks."test:omp"]
description = "Check installed tool imports and host extension registration without model calls"
run = "bash tests/omp-tools-validate.sh"

[tasks."test:omp-fixture"]
description = "Exercise OMP health-check success and failure cases"
run = "bash tests/omp-tools-fixture.sh"

# review_pr's reviewer programs come from the profile's pins, so a fresh Linux box
# (a Relay guest) has both. Runs in doctor; this task is the direct runner.
[tasks."test:review-tools"]
description = "Check the profile pins review_pr's reviewer programs and, on Linux, that both start"
run = 'bash tests/review-tools-fixture.sh "$PWD"'

# The backlog review's transport bounds. The tool is mise-dot tracked, so the
# test imports the installed copy and this task is the registered runner.
[tasks."test:backlog-transport"]
description = "Bound every backlog-review request by parent cancellation and one deadline"
run = "bun test tests/backlog_transport.test.ts"

# The rule fixture gate is mise-dot tracked and installed at ~/.omp/agent/rules, so
# the test evaluates the live rule set rather than a copy: a rule that matches its own
# text fails this task. tests/rules-gate.sh decides the three states: no omp install
# prints SKIP, an install without its gate fails, an install with it runs it. The task
# is wired into test, which ci and the workflow's test job both run.
[tasks."test:rules"]
description = "Fail when a rule in the installed rule set matches its own text"
run = "bash tests/rules-gate.sh"

[tasks."test:rules-fixture"]
description = "Pin the rule gate's SKIP, FAIL and exit-code branches against scratch installs"
run = "bash tests/rules-gate-fixture.sh"

[tasks."list:skills:unmanaged"]
alias = ["list:skills:unamanaged", "skills:unmanaged"]
description = "List skills in ~/.agents/available-skills not tracked in .skill-lock.json"
run = "~/.agents/bin/aubx-skills unmanaged"
[tasks.ci]
description = "lint, then test (the file check and the rule fixture gate)"
run = ["mise run lint", "mise run test"]
