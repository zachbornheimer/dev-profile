# Files on this branch are the source. mise dot apply installs them.
# hk/hk.pkl stays because hk reads Pkl. The generator does not.

min_version = "2026.10.0"

[env]
DEV_PROFILE_BACKUPS = "{{env.HOME}}/.local/state/dev-profile/backups"

[bootstrap.packages]
"brew:git" = "latest"

[tasks.setup]
description = "Link the global mise config, apply the dotfiles it declares, then install the recorded upstream skills"
# Two runs: the first links ~/.config/mise/config.toml; a fresh mise process then reads its table.
# Upstream skills are not committed; aubx-skills installs them from agents/available-skills/.skill-lock.json.
run = ["mise dot apply --yes", "mise dot apply --yes", "~/.agents/bin/aubx-skills sync"]

[tasks.doctor]
description = "Syntax-check the files this branch installs"
run = "bash tests/doctor.sh"

[tasks.fmt]
description = "Format this repo with the branch dprint config"
run = 'dprint fmt --config config/dprint.jsonc "**/*"'

[tasks.lint]
description = "Check formatting"
run = 'dprint check --config config/dprint.jsonc "**/*"'

[tasks.build]
description = "Nothing to render"
run = "mise run doctor"

[tasks.test]
description = "Check the installed files"
run = "mise run doctor"

[tasks."test:kitty-tabs"]
description = "Render custom tab labels with the installed Kitty engine (no UI)"
run = "kitty +runpy \"import runpy; runpy.run_path('tests/kitty_tabs.py', run_name='__main__')\""

# The scope guard is a hook pair (tool.before + turn.stop) whose tests drive the real hook
# by path with a fake judge, so they need no network and no omp session.
[tasks."test:scope-guard"]
description = "Run the scope-guard hook tests"
run = "pytest agents/hooks/tests/test_scope_guard.py"

[tasks."list:skills:unmanaged"]
alias = ["list:skills:unamanaged", "skills:unmanaged"]
description = "List skills in ~/.agents/available-skills not tracked in .skill-lock.json"
run = "~/.agents/bin/aubx-skills unmanaged"
[tasks.ci]
description = "lint, then the file check"
run = ["mise run lint", "mise run test"]

# The dotfile table lives in config/mise.toml, which this links as the global mise config.
# A fresh machine runs `mise run setup` here once; after that, `mise dot apply` works anywhere.
[dotfiles]
"~/.config/mise/config.toml" = { source = "~/Developer/Personal/dev-profile/config/mise.toml", mode = "symlink" }
