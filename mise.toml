# Dev Profile kernel. `mise bootstrap --from <this repo>` installs Pkl, then the
# bootstrap task renders profile.pkl into DEV_PROFILE_OUT, backs up live configs,
# and re-runs `mise bootstrap` on the generated config, which installs the tools
# and links the live configs. `mise run rollback` restores the originals.

min_version = "2026.10.0"

[tools]
pkl = "0.32.1"

[env]
# Overridable so validation can render somewhere other than the live output.
DEV_PROFILE_OUT = "{{ get_env(name='DEV_PROFILE_OUT', default=env.HOME ~ '/.local/share/dev-profile') }}"
DEV_PROFILE_BACKUPS = "{{env.HOME}}/.local/state/dev-profile/backups"

[bootstrap.packages]
"brew:git" = "latest"

[tasks.generate]
description = "Render profile.pkl into DEV_PROFILE_OUT"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Render fresh, then swap, so files dropped from profile.pkl do not linger.
next="$DEV_PROFILE_OUT.next"
rm -rf "$next"
pkl eval -m "$next" profile.pkl >/dev/null
chmod +x "$next"/bin/*
rm -rf "$DEV_PROFILE_OUT"
mv "$next" "$DEV_PROFILE_OUT"
echo "generated $DEV_PROFILE_OUT"
"""

[tasks.bootstrap]
description = "Generate, back up live configs, then re-bootstrap on the generated config"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run doctor  # generates, then syntax-checks before anything is linked
mise run backup-live
mise run install-git-hooks
MISE_GLOBAL_CONFIG_FILE="$DEV_PROFILE_OUT/mise-profile.toml" \\
  mise bootstrap --yes --skip task,final-hook --force-dotfiles
"""

[tasks.setup]
description = "Same as `mise bootstrap`"
run = "mise bootstrap --yes"

[tasks.diff-live]
description = "Show what install-live would change in live configs"
run = 'MISE_GLOBAL_CONFIG_FILE="$DEV_PROFILE_OUT/mise-profile.toml" mise bootstrap dotfiles diff'

[tasks.install-git-hooks]
description = "Point global git hooks at hk (profile.pkl gitHooks)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise_bin="$(command -v mise)"
pkl eval -x 'gitHooks.toMap().fold(List(), (acc, event, cmd) -> acc.add("\(event)\t\(cmd)")).join("\n")' profile.pkl |
  while IFS=$'\t' read -r event cmd || [[ -n "$event" ]]; do
    git config --global "hook.hk-$event.event" "$event"
    git config --global "hook.hk-$event.command" "test \"\${HK:-1}\" = \"0\" || $mise_bin x hk -- $cmd"
    echo "git hook $event -> $cmd"
  done
'''

[tasks.backup-live]
description = "Copy live configs that install would replace (skips ones already linked)"
run = """
#!/usr/bin/env bash
set -euo pipefail
backup="$DEV_PROFILE_BACKUPS/$(date -u +%Y%m%dT%H%M%SZ)"
mkdir -p "$backup"
pkl eval -x 'liveTargets.keys.join("\\n")' profile.pkl >"$backup/targets"
saved=0
while IFS= read -r target || [[ -n "$target" ]]; do
  live="${target/#\\~/$HOME}"
  [[ "$(readlink "$live" 2>/dev/null)" == "$DEV_PROFILE_OUT"/* ]] && continue
  if [[ -e "$live" || -L "$live" ]]; then
    mkdir -p "$backup$(dirname "$live")"
    cp -pP "$live" "$backup$live"
    saved=$((saved + 1))
  fi
done <"$backup/targets"
if [[ "$saved" -eq 0 && -n "$(ls -1 "$DEV_PROFILE_BACKUPS" | grep -v '\\.restored$' | grep -v "^${backup##*/}$" || true)" ]]; then
  rm -rf "$backup"  # already installed; keep the earlier backup as the rollback point
  echo "live configs already linked; no new backup"
else
  echo "backed up $saved live config(s) to $backup"
fi
"""

[tasks.install-live]
description = "Re-link generated configs into live paths (bootstrap already does this)"
depends = ["doctor", "backup-live"]
run = 'MISE_GLOBAL_CONFIG_FILE="$DEV_PROFILE_OUT/mise-profile.toml" mise bootstrap dotfiles apply --yes --force'

[tasks.rollback]
description = "Restore live configs from the newest install-live backup"
run = """
#!/usr/bin/env bash
set -euo pipefail
latest="$(ls -1 "$DEV_PROFILE_BACKUPS" 2>/dev/null | grep -v '\\.restored$' | tail -1 || true)"
[[ -n "$latest" ]] || { echo "no install-live backup to restore" >&2; exit 1; }
backup="$DEV_PROFILE_BACKUPS/$latest"
while IFS= read -r target || [[ -n "$target" ]]; do
  live="${target/#\\~/$HOME}"
  rm -f "$live"
  if [[ -e "$backup$live" || -L "$backup$live" ]]; then
    cp -pP "$backup$live" "$live"
  fi
done <"$backup/targets"
mv "$backup" "$backup.restored"
echo "restored live configs from $backup"
"""

[tasks.doctor]
description = "Syntax-check every generated file with the tool that consumes it"
depends = ["generate"]
run = """
#!/usr/bin/env bash
set -euo pipefail
out="$DEV_PROFILE_OUT"
fail() { echo "FAIL: $*" >&2; exit 1; }
HK_FILE="$out/hk-config.pkl" hk validate >/dev/null || fail hk-config.pkl
dprint output-resolved-config --config "$out/dprint.jsonc" >/dev/null || fail dprint.jsonc
wt --config "$out/worktrunk.toml" config show >/dev/null || fail worktrunk.toml
for alias in up pr ship ship-all; do
  wt --config "$out/worktrunk.toml" config alias show "$alias" >/dev/null || fail "worktrunk alias $alias"
done
wt --config "$out/worktrunk.toml" config alias dry-run pr -- @ >/dev/null || fail worktrunk alias dry-run pr
grep -Fq "$out/bin/dev-profile-pkl-fmt" "$out/dprint.jsonc" || fail "dprint pkl exec must be $out/bin/dev-profile-pkl-fmt"
jq empty "$out/profile.json" || fail profile.json
luac -p "$out/conform.lua" || fail conform.lua
zsh -n "$out/shell.zsh" || fail shell.zsh
for f in "$out"/bin/*; do bash -n "$f" || fail "${f##*/}"; done
shellcheck "$out"/bin/* tests/*.sh || fail shellcheck
golangci-lint config verify --config "$out/golangci.yml" || fail golangci.yml
grep -F "allow-parallel-runners: true" "$out/golangci.yml" || fail "golangci allow-parallel-runners"
grep -F "composer audit --locked" "$out/bin/dev-profile-contract-php" || fail "composer audit --locked"
if pkl eval -x 'checks["oxlint"].check' profile.pkl | grep -F -- "--deny-warnings"; then fail "oxlint must not deny-warnings"; fi
for cmd in $(grep -ohE "dev-profile-[a-z0-9-]+" "$out/src/profile.pkl" "$out"/src/tools/*/*.pkl | sort -u); do [[ -x "$out/bin/$cmd" ]] || fail "hk step command without a rendered bin script: $cmd"; done
pkl test tests/profile.test.pkl || fail "pkl test (regenerate the snapshot with: pkl test --overwrite tests/profile.test.pkl)"
bash tests/contract-fixtures.sh "$out" || fail "contract fixtures"
bash tests/go-fix-fixture.sh "$out" || fail "go-fix fixture"
bash tests/modernizer-fixture.sh "$out" || fail "modernizer fixture"
bash tests/guards-fixture.sh "$out" || fail "guards fixture"
for gem_tool in bundle-audit brakeman; do command -v "$gem_tool" >/dev/null || echo "note: $gem_tool is not installed; run mise install (pinned in profile.pkl tools). Its push check is skipped until then."; done
bash tests/ship-fixture.sh "$out" || fail "ship fixture"
echo "doctor ok"
"""

[tasks.explain]
description = "What runs at each hook: mise run explain [tool-or-category]"
depends = ["generate"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# Reads the rendered profile.json; a tool name or a tools/ category narrows it.
jq -r --arg q "${1:-}" '
  .tools | to_entries
  | map(select($q == "" or .key == $q or .value.category == $q))
  | if length == 0 then "no tool or category named \($q)" | halt_error(1) else . end
  | .[] | .key as $tool | .value
  | "\(.category)/\($tool): \(.doc)",
    (.hooks | to_entries[] | "  \(.key): \(.value.step)" +
      (if .value.fix then "  fix: \(.value.fix)" else "" end) +
      (if .value.check then "  check: \(.value.check)" else "" end) +
      (if .value.files then "  files: \(.value.files)" else "" end) +
      (if (.value.after | length) > 0 then "  after: \(.value.after | join(" "))" else "" end)),
    (if (.scripts | length) > 0 then "  scripts: \(.scripts | join(" "))" else empty end)
' "$DEV_PROFILE_OUT/profile.json"
"""

[tasks.fmt]
description = "Format this repo with the generated dprint config"
depends = ["generate"]
run = 'dprint fmt --config "$DEV_PROFILE_OUT/dprint.jsonc" "**/*"'

[tasks.lint]
description = "Check formatting"
depends = ["generate"]
run = 'dprint check --config "$DEV_PROFILE_OUT/dprint.jsonc" "**/*"'

[tasks.build]
description = "Render the profile (this repo's artifact)"
run = "mise run generate"

[tasks.test]
description = "Validate generated configs and run the contract fixtures (temp render)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Render into a throwaway dir: a push must never redeploy the live profile.
# Resolved path: macOS mktemp returns /var/…, a symlink pkl rejects as outside the output dir.
DEV_PROFILE_OUT="$(cd "$(mktemp -d)" && pwd -P)"
export DEV_PROFILE_OUT
trap 'rm -rf "$DEV_PROFILE_OUT"' EXIT
mise run doctor
"""

[tasks.ci]
description = "lint, test, scan (sequential: lint and test both regenerate DEV_PROFILE_OUT)"
run = ["mise run lint", "mise run test", "mise run scan"]
