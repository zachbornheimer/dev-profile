[tasks.fmt]
description = "Format Go sources in this repository"
run = "gofmt -w ."

[tasks.test]
description = "Run profile-selection and dogfood tests against live mise"
run = "go test ./..."

[tasks.install-profile]
description = "Install the personal overlay at ~/Developer/Personal/mise.toml and trust it"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root="$(git rev-parse --show-toplevel)"
src="${root}/profiles/personal.toml"
dest="${HOME}/Developer/Personal/mise.toml"
cp "${src}" "${dest}"
mise trust --yes "${dest}" || mise trust "${dest}"
echo "installed ${dest}"
'''
