[tools]
pkl = "0.32.1"
hk = "latest"
dprint = "latest"
worktrunk = "latest"
go = "latest"
bun = "latest"
stylua = "2.5.2"
aube = { version = "latest", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }
uv = "latest"
"github:rohansx/workz" = "0.11.0"
tflint = "0.64.0"
buf = "1.73.0"
"npm:@agentclientprotocol/codex-acp" = "2.1.1"
"npm:@agentclientprotocol/claude-agent-acp" = "0.88.0"
"npm:stylelint" = "17.16.0"
hadolint = "2.15.1"
"aqua:rhysd/actionlint" = "1.7.12"
pinact = "5.0.0"
zizmor = "1.30.1"
"go:golang.org/x/tools/cmd/goimports" = "0.51.0"
"aqua:securego/gosec" = "2.29.0"
golangci-lint = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"npm:oxlint" = "1.87.0"
kube-linter = "0.8.3"
kubeconform = "0.8.0"
"npm:markdownlint-cli" = "0.49.1"
ruff = "0.16.10"
betterleaks = "1.9.0"
"conda:git" = "2.56.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
jq = "1.8.2"
"gem:brakeman" = "8.1.0"
"gem:bundler-audit" = "0.9.3"
cargo-deny = "0.20.2"
shellcheck = "0.11.0"
opentofu = "1.13"
"pypi:yamllint" = "1.38.0"
"pypi:semgrep" = "1.182.1"
"github:0sec-labs/foxguard" = "latest"

[settings]
experimental = true
auto_install = true
activate_aggressive = true
tool_update.global_auto = "12h"
not_found_auto_install = true
not_found_auto_install_registry = true
idiomatic_version_file_ignore_minimum_versions = true
idiomatic_version_file_enable_tools = ["go", "node", "python", "ruby", "npm", "pnpm", "yarn"]
trusted_config_paths = ["~/Zysys", "~/Developer"]

[settings.status]
show_deps_stale = false
