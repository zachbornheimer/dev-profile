# Deploy map. Every source is relative to dotfiles.root, which is the clone: profile/mise.toml
# derives it from where the linked fragment lives, so the clone can sit at any path. Only the
# first apply on a fresh machine names the clone: `MISE_DOTFILES_ROOT=<clone> mise dot apply`.
# exclude = ["**"] stops the group walking the rest of the repo into $HOME; only the entries
# below deploy. The code-root targets under ~/Developer/Personal are in config/personal.toml.
[dotfile_groups.dev-profile]
root = "."
exclude = ["**"]

[dotfile_groups.dev-profile.entries]
"~/.agents" = { source = "agents", mode = "symlink" }
"~/.config/dprint/dprint.jsonc" = { source = "config/dprint.jsonc", mode = "symlink" }
"~/.config/hk/config.pkl" = { source = "hk/hk.pkl", mode = "symlink" }
"~/.config/mise/conf.d/dev-profile" = { source = "profile", mode = "symlink" }
"~/.config/worktrunk/config.toml/dev-profile" = { source = "config/worktrunk.toml", merge = true }
"~/.config/yamllint/config" = { source = "config/yamllint.yaml", mode = "symlink" }
"~/.local/share/dev-profile/bin" = { source = "bin", mode = "symlink" }
"~/.local/share/dev-profile/mise.zsh" = { source = "shell/mise.zsh", mode = "symlink" }
"~/.local/share/dev-profile/shell.zsh" = { source = "shell/shell.zsh", mode = "symlink" }
"~/.local/share/dev-profile/xdg" = { source = "xdg", mode = "symlink" }
"~/.stylelintrc.json" = { source = "config/stylelintrc.json", mode = "symlink" }

# Self-heal and automatic omp fallback for the mise history watcher: kills
# duplicate `mise dot watch` processes, clears stale history locks, restarts a
# wedged watcher, and drops into a headless omp agent to reconcile sync
# conflicts, sync/publish errors, or apply failures by hand (2026-11-01 outage).
[bootstrap.macos.launchd.agents.mise-history-watchdog]
program = "/bin/sh"
args = [
  "-c",
  '''
export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
if [ -r "$HOME/.config/agent-state/env" ]; then set -a; . "$HOME/.config/agent-state/env"; set +a; fi
exec "$HOME/.local/share/dev-profile/bin/dev-profile-mise-history-watchdog"
''',
]
start_interval = 300
stdout_path = "~/Library/Logs/mise-history-watchdog.log"
stderr_path = "~/Library/Logs/mise-history-watchdog.err.log"
process_type = "Background"

# The same self-heal, conflict, and apply fallback on a Linux fleet box: one script,
# run by a systemd user timer (5 minutes after the last run, first run 2 minutes
# after boot). The oneshot unit is started only by its timer. Its output is the
# journal: `journalctl --user -u dev.mise.mise-history-watchdog`.
[bootstrap.linux.systemd.units.mise-history-watchdog]
description = "mise dot history watcher self-heal and omp conflict/apply fallback"
type = "oneshot"
exec_start = "%h/.local/share/dev-profile/bin/dev-profile-mise-history-watchdog"
environment = { PATH = "%h/.local/share/mise/shims:%h/.local/bin:/usr/local/bin:/usr/bin:/bin" }
standard_output = "journal"
standard_error = "journal"
start = false
wanted_by = []
[bootstrap.linux.systemd.units.mise-history-watchdog-timer]
description = "run the mise dot history watchdog every 5 minutes"
on_boot_sec = "2min"
on_unit_active_sec = "5min"
unit = "mise-history-watchdog"
