[tools]
chezmoi = "2.73.3"
colima = "latest"
gofumpt = "latest"

[env._]
# ~/.agents/bin holds the aubx scope guard; it must precede mise tool bins so
# `aubx skills add -g` never reaches the raw installer in a mise-built PATH.
path = ["~/.agents/bin", "~/.local/share/dev-profile/bin"]

[settings]
# mise itself shells out to `git` (e.g. `git ls-remote golang/go` to list Go
# versions). With a `git` shim on PATH that call re-enters mise, which resolves
# the toolset again, which runs `git ls-remote` again: an unbounded fork loop
# whenever mise has no warm cache (seen under aubx-skills' throwaway HOME).
# conda:git (dev-profile) stays installed; these names just get no shim, so
# `git` resolves to /opt/homebrew/bin/git (2.56, same as the pinned conda git).
shims.exclude = [
  "git",
  "git-credential-osxkeychain",
  "git-cvsserver",
  "git-receive-pack",
  "git-shell",
  "git-upload-archive",
  "git-upload-pack",
  "gitk",
]

[tasks."learn:doctor"]
# /learn is three files that `mise dot apply` installs together: the omp command, the launcher it
# calls, and the capability CLI the launcher runs. A missing or stale one fails here, not at the prompt.
description = "Check /learn wiring: the omp command, its launcher, the capability CLI, and the dispatch flag"
run = """
test -f "$HOME/.omp/agent/extensions/learn-command.ts"
test -x "$HOME/.agents/bin/learn-launch"
command -v capability >/dev/null
"$HOME/.agents/bin/learn-launch" --dry-run --dispatch omp:00000000-0000-0000-0000-000000000000 >/dev/null
"""

[bootstrap.macos.launchd.agents.weekly-wt-prune]
program = "/bin/sh"
args = [
  "-c",
  '''
export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
fd -H -t d '^\.git$' -x sh -c 'cd "$1" && wt step prune --min-age=0s' _ {//}
''',
]

working_directory = "~/Developer"
start_calendar_interval = { weekday = 0, hour = 9, minute = 0 }
stdout_path = "~/Library/Logs/weekly-wt-prune.log"
stderr_path = "~/Library/Logs/weekly-wt-prune.err.log"
process_type = "Background"

# PARKED, NOT APPLIED (2026-10-26). The ContextForge bridges are declared below but commented out,
# because no launchd-spawned supervisor reaches its first bridge spawn on this machine today.
#
# The bug, as measured: a job started by launchd gets the full PATH, HOME and the exported Keychain
# secrets in its environment, reaches `state = running` (or `xpcproxy`), then spawns no bridge child,
# binds none of 4501-4503 and writes nothing to bridges.log/bridges.err. Both the mise label and the
# hand-written org.zysys label do this; the identical start-bridges.sh started from a shell binds in
# about 15 s. So it is not the plist and not the script's first `security find-generic-password`:
# the trace belongs inside `capability contextforge bridges` before its first child spawn.
#
# Consequence while parked: after a logout or reboot nothing starts the bridges. Start one by hand:
#   PATH="$HOME/.local/share/mise/installs/node/26/bin:$PATH" nohup ~/.config/contextforge/start-bridges.sh &
# and check `lsof -nP -iTCP:4503 -sTCP:LISTEN` then a tools/list (4503 serves 8 tools, 4502 serves 2).
# Port 4501 is the docker-catalog bridge, which needs Docker Desktop running.
#
# Uncomment only after a launchd-started job is seen binding a port, or `mise bootstrap` will install
# it beside org.zysys and leave two supervisors racing for the same ports.
#
# [bootstrap.macos.launchd.agents.contextforge-bridges]
# # start-bridges.sh exports the gateway secrets from the Keychain and execs
# # `capability contextforge bridges`, which restarts a bridge whose child exits.
# program = "/Users/zbornheimer/.config/contextforge/start-bridges.sh"
# # launchd hands the job /usr/bin:/bin:/usr/sbin:/sbin, and `capability` is `#!/usr/bin/env node`
# # with node living only in the mise install, so the job cannot exec without this PATH.
# environment = { HOME = "/Users/zbornheimer", PATH = "/Users/zbornheimer/.local/share/mise/installs/node/26/bin:/Users/zbornheimer/.local/bin:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
# working_directory = "~/.config/contextforge"
# keep_alive = true
# run_at_load = true
# kickstart = true
# stdout_path = "~/.config/contextforge/logs/bridges.log"
# stderr_path = "~/.config/contextforge/logs/bridges.err"
# process_type = "Background"

[bootstrap.services.mise-history]
builtin = "history-watch"

