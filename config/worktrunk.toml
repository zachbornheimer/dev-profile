worktree-path = "{{ repo_path }}/../.worktrees/{{ repo }}-{{ branch | sanitize }}"

[step.copy-ignored]
exclude = [".venv/", "**/.venv/", "backups/", "**/backups/"]

[commit.generation]
command = "_llm"
template = """
<task>Write a commit message for the staged changes below.</task>

<format>
- Subject MUST be `type(optional-scope): imperative description`
- Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
- Subject under 72 chars
- For material changes, add a blank line then a body paragraph explaining the change
- Output only the commit message, no quotes or code blocks
</format>

<style>
- Imperative mood: \"Add feature\" not \"Added feature\"
- Always Conventional Commits even when recent commits are not
- Describe the change, not the intent or benefit
</style>
{% if user_guidance %}
<user-guidance>
{{ user_guidance }}
</user-guidance>
{% endif %}{% if project_guidance %}
<project-guidance>
{{ project_guidance }}
</project-guidance>
{% endif %}
<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

<context>
Branch: {{ branch }}
{% if recent_commits %}<recent_commits>
{% for commit in recent_commits %}- {{ commit }}
{% endfor %}</recent_commits>{% endif %}
</context>"""
squash-template = """
<task>Write a commit message for the change in <diff>, which is everything the squash will record. <commits> lists what it folds in.</task>

<format>
- Subject MUST be `type(optional-scope): imperative description`
- Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
- Subject under 72 chars
- For material changes, add a blank line then a body paragraph explaining the change
- Output only the commit message, no quotes or code blocks
</format>

<style>
- Imperative mood: \"Add feature\" not \"Added feature\"
- Always Conventional Commits even when folded commits are not
- Describe the change, not the intent or benefit
</style>
{% if user_guidance %}
<user-guidance>
{{ user_guidance }}
</user-guidance>
{% endif %}{% if project_guidance %}
<project-guidance>
{{ project_guidance }}
</project-guidance>
{% endif %}
<commits branch=\"{{ branch }}\" target=\"{{ target_branch }}\">
{% for detail in commit_details %}- {{ detail.subject }}
{% endfor %}</commits>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>"""
template-append = """
Always Conventional Commits even when recent or folded commits are not.
Subject MUST be type(optional-scope): imperative description.
Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
Subject under 72 chars."""

[aliases]
up = """
git fetch --all --prune; wt step for-each -- sh -c '
  git rev-parse --verify -q @{u} >/dev/null || exit 0
  g=$(git rev-parse --git-dir)
  rebasing() { test -d \"$g/rebase-merge\" || test -d \"$g/rebase-apply\"; }
  rebasing && exit 0
  git diff --quiet HEAD || { git merge --ff-only --no-autostash @{u}; exit 0; }
  git rebase @{u} --no-autostash || { rebasing || exit 0; git rebase --abort; }
'"""
pr = "{% if create is defined %}wt switch --create {{ create }} --no-cd -x ~/.local/share/dev-profile/bin/dev-profile-pr -- -- {{ args }}{% else %}wt switch {{ args or '@' }} -x ~/.local/share/dev-profile/bin/dev-profile-pr --{% endif %}"
pr-draft = "{% if create is defined %}wt switch --create {{ create }} --no-cd -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --draft -- {{ args }}{% else %}wt switch {{ args or '@' }} -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --draft{% endif %}"
pr-auto = "{% if create is defined %}wt switch --create {{ create }} --no-cd -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --auto -- {{ args }}{% else %}wt switch {{ args or '@' }} -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --auto{% endif %}"
done = "~/.local/share/dev-profile/bin/dev-profile-done {{ args }}"
prune = "wt step prune --min-age=0s"
tree-for-changes = """
{% if args %}
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  if git diff --quiet && git diff --cached --quiet && [ -z \"$(git ls-files --others --exclude-standard)\" ]; then
    echo \"wt commit-unstaged: nothing to commit (repository has no commits and no files to stage).\" >&2
    exit 1
  fi
  exec wt step commit
fi
{% else %}
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  echo \"wt tree-for-changes: repository has no commits yet; run 'wt commit-unstaged' or 'wt step commit' to create the initial commit first.\" >&2
  exit 1
fi
{% endif %}
git stash push -u || exit 1
id=$(uuidgen) || { git stash pop; exit 1; }
id=$(printf '%s' \"$id\" | tr '[:upper:]' '[:lower:]')
[ -n \"$id\" ] || { git stash pop; exit 1; }
{% if args %}
if wt switch --create \"$id\" --no-cd -x sh -- -c 'git stash pop && exec \"$@\"' tree-for-changes {{ args }}; then
  wt switch ^
else
  status=$?
  if git show-ref --verify --quiet \"refs/heads/$id\"; then
    wt switch \"$id\"
  else
    git stash pop || true
  fi
  exit \"$status\"
fi
{% else %}
if ! wt switch --create \"$id\" -x git -- stash pop; then
  status=$?
  git show-ref --verify --quiet \"refs/heads/$id\" || git stash pop || true
  exit \"$status\"
fi
{% endif %}"""
land = """
{% if branch | default(\"\") == default_branch %}
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  exec wt step commit
fi
wt tree-for-changes -- wt land --landing=merge
{% elif landing | default(\"\") == \"merge\" %}
if ! git diff --quiet || ! git diff --cached --quiet || [ -n \"$(git ls-files --others --exclude-standard)\" ]; then
  wt step commit || exit 1
fi
wt merge
{% elif landing | default(\"\") == \"pr\" %}
if ! git diff --quiet || ! git diff --cached --quiet || [ -n \"$(git ls-files --others --exclude-standard)\" ]; then
  wt step commit || exit 1
fi
wt pr-auto
{% elif landing | default(\"\") != \"\" %}
echo \"wt land: --landing must be merge or pr\" >&2
exit 1
{% elif owner | default(\"\") | lower == \"zachbornheimer\" or \"github.com/zachbornheimer/\" in remote_url | default(\"\") | lower or \"github.com:zachbornheimer/\" in remote_url | default(\"\") | lower %}
if ! git diff --quiet || ! git diff --cached --quiet || [ -n \"$(git ls-files --others --exclude-standard)\" ]; then
  wt step commit || exit 1
fi
wt merge
{% else %}
if ! git diff --quiet || ! git diff --cached --quiet || [ -n \"$(git ls-files --others --exclude-standard)\" ]; then
  wt step commit || exit 1
fi
wt pr-auto
{% endif %}"""
commit-unstaged = """
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  exec wt step commit
fi
wt tree-for-changes -- wt land --landing=merge"""
commit-fix = "~/.local/share/dev-profile/bin/dev-profile-commit-fix step commit {{ args }}"

[post-start]
copy = "~/.local/share/dev-profile/bin/dev-profile-worktree-copy"

[post-remove]
reap = "~/.local/share/dev-profile/bin/dev-profile-dev reap {{ worktree_path }}"

[post-switch]
retire-legacy-hooks = "~/.local/share/dev-profile/bin/dev-profile-retire-legacy-hooks"

[pre-merge]
protect-omp-main = """
{% if repo == 'oh-my-pi' and (target == 'main' or target == 'master') %}
echo "ERROR: Merging into '{{ target }}' in oh-my-pi is forbidden ('main' is a read-only mirror of upstream can1357/oh-my-pi)." >&2
echo "Push your topic branch to 'fork' ('git push -u fork {{ branch }}') and register it in dev-profile/config/omp-rebuild.toml via 'dev-profile-omp-sync --include {{ branch }} --push'." >&2
exit 1
{% else %}
true
{% endif %}"""

[post-commit]
merge-if-clean = """
{% if branch == 'chore/uncommited' and not target %}
sh -c 'test \"${WT_AUTO_MERGE:-}\" = 1 && exit 0; git merge-base --is-ancestor HEAD {{ default_branch }} && exit 0; git merge-tree --write-tree --quiet {{ default_branch }} HEAD >/dev/null || exit 0; WT_AUTO_MERGE=1 exec wt merge'
{% else %}
true
{% endif %}"""
