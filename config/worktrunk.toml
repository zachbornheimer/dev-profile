worktree-path = "{{ repo_path }}/../.worktrees/{{ repo }}-{{ branch | sanitize }}"

[step.copy-ignored]
# public/assets/ is Rails precompiled output for the SOURCE tree: copied into a
# worktree it serves stale JS that does not match the branch (ninja-quoter's
# website_quoter_review_spec failed on it, 2026-11-06). Each tree builds its own.
exclude = [
  ".venv/",
  "**/.venv/",
  "backups/",
  "**/backups/",
  "public/assets/",
  "**/public/assets/",
  "agents/hooks/state/",
  "**/agents/hooks/state/",
]

[commit.generation]
command = "_llm"
template = """
<task>Write a commit message for the staged changes below.</task>

<format>
- Subject MUST be `type(optional-scope): imperative description`
- Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
- Subject under 72 chars
- For material changes, add a blank line then a body paragraph explaining the change
- Output only the commit message, no quotes or code blocks
</format>

<style>
- Imperative mood: \"Add feature\" not \"Added feature\"
- Always Conventional Commits even when recent commits are not
- Describe the change, not the intent or benefit
</style>
{% if user_guidance %}
<user-guidance>
{{ user_guidance }}
</user-guidance>
{% endif %}{% if project_guidance %}
<project-guidance>
{{ project_guidance }}
</project-guidance>
{% endif %}
<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

<context>
Branch: {{ branch }}
{% if recent_commits %}<recent_commits>
{% for commit in recent_commits %}- {{ commit }}
{% endfor %}</recent_commits>{% endif %}
</context>"""
squash-template = """
<task>Write a commit message for the change in <diff>, which is everything the squash will record. <commits> lists what it folds in.</task>

<format>
- Subject MUST be `type(optional-scope): imperative description`
- Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
- Subject under 72 chars
- For material changes, add a blank line then a body paragraph explaining the change
- Output only the commit message, no quotes or code blocks
</format>

<style>
- Imperative mood: \"Add feature\" not \"Added feature\"
- Always Conventional Commits even when folded commits are not
- Describe the change, not the intent or benefit
</style>
{% if user_guidance %}
<user-guidance>
{{ user_guidance }}
</user-guidance>
{% endif %}{% if project_guidance %}
<project-guidance>
{{ project_guidance }}
</project-guidance>
{% endif %}
<commits branch=\"{{ branch }}\" target=\"{{ target_branch }}\">
{% for detail in commit_details %}- {{ detail.subject }}
{% endfor %}</commits>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>"""
template-append = """
Always Conventional Commits even when recent or folded commits are not.
Subject MUST be type(optional-scope): imperative description.
Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
Subject under 72 chars."""

[aliases]
up = """
git fetch --all --prune; wt step for-each -- sh -c '
  git rev-parse --verify -q @{u} >/dev/null || exit 0
  g=$(git rev-parse --git-dir)
  rebasing() { test -d \"$g/rebase-merge\" || test -d \"$g/rebase-apply\"; }
  rebasing && exit 0
  git diff --quiet HEAD || { git merge --ff-only --no-autostash @{u}; exit 0; }
  git rebase @{u} --no-autostash || { rebasing || exit 0; git rebase --abort; }
'"""
pr = "{% if create is defined %}wt switch --create {{ create }} --no-cd -x ~/.local/share/dev-profile/bin/dev-profile-pr -- -- {{ args }}{% else %}wt switch {{ args or '@' }} -x ~/.local/share/dev-profile/bin/dev-profile-pr --{% endif %}"
pr-draft = "{% if create is defined %}wt switch --create {{ create }} --no-cd -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --draft -- {{ args }}{% else %}wt switch {{ args or '@' }} -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --draft{% endif %}"
pr-auto = "{% if create is defined %}wt switch --create {{ create }} --no-cd -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --auto -- {{ args }}{% else %}wt switch {{ args or '@' }} -x ~/.local/share/dev-profile/bin/dev-profile-pr -- --auto{% endif %}"
done = "~/.local/share/dev-profile/bin/dev-profile-done {{ args }}"
prune = "wt step prune --min-age=0s"
tree-for-changes = """
{% if args %}
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  if git diff --quiet && git diff --cached --quiet && [ -z \"$(git ls-files --others --exclude-standard)\" ]; then
    echo \"wt commit-unstaged: nothing to commit (repository has no commits and no files to stage).\" >&2
    exit 1
  fi
  exec wt step commit
fi
{% else %}
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  echo \"wt tree-for-changes: repository has no commits yet; run 'wt commit-unstaged' or 'wt step commit' to create the initial commit first.\" >&2
  exit 1
fi
{% endif %}
stash_before=$(git rev-parse -q --verify refs/stash) || stash_before=
git stash push -u || exit 1
stash_after=$(git rev-parse -q --verify refs/stash) || stash_after=
if [ \"$stash_after\" = \"$stash_before\" ]; then
  echo \"wt tree-for-changes: git stash saved nothing, so there is nothing to move; no worktree created.\" >&2
  exit 0
fi
stash_ref=$(git stash list --format='%gd %H' | awk -v want=\"$stash_after\" '$2 == want { print $1; exit }')
if [ -z \"$stash_ref\" ]; then
  echo \"wt tree-for-changes: the stash just created ($stash_after) is not in refs/stash; run 'git stash apply $stash_after' to recover it.\" >&2
  exit 1
fi
id=$(uuidgen) || { git stash pop \"$stash_ref\"; exit 1; }
id=$(printf '%s' \"$id\" | tr '[:upper:]' '[:lower:]')
[ -n \"$id\" ] || { git stash pop \"$stash_ref\"; exit 1; }
{% if args %}
if wt switch --create \"$id\" --no-cd -x sh -- -c 'git stash pop \"$1\" && shift && exec \"$@\"' tree-for-changes \"$stash_ref\" {{ args }}; then
  wt switch ^
else
  status=$?
  if git show-ref --verify --quiet \"refs/heads/$id\"; then
    wt switch \"$id\"
  else
    git stash pop \"$stash_ref\" || true
  fi
  exit \"$status\"
fi
{% else %}
if ! wt switch --create \"$id\" -x git -- stash pop \"$stash_ref\"; then
  status=$?
  git show-ref --verify --quiet \"refs/heads/$id\" || git stash pop \"$stash_ref\" || true
  exit \"$status\"
fi
{% endif %}"""
land = """
{% if not branch %}
echo \"wt land: detached HEAD (a pull --rebase, rebase, or checkout of a commit is in progress); finish or abort it, or switch to a branch, then rerun. Nothing was committed.\" >&2
exit 1
{% elif branch == default_branch %}
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  exec wt step commit
fi
wt tree-for-changes -- wt land --landing=merge
{% elif landing | default(\"\") == \"merge\" %}
if ! git diff --quiet || ! git diff --cached --quiet; then
  wt step commit --stage=tracked || exit 1
fi
untracked=$(git ls-files --others --exclude-standard)
if [ -n \"$untracked\" ]; then
  echo 'wt land: left these untracked files uncommitted (git add the ones you mean to keep):' >&2
  echo \"$untracked\" >&2
fi
wt merge --stage=tracked
{% elif landing | default(\"\") == \"pr\" %}
if ! git diff --quiet || ! git diff --cached --quiet; then
  wt step commit --stage=tracked || exit 1
fi
untracked=$(git ls-files --others --exclude-standard)
if [ -n \"$untracked\" ]; then
  echo 'wt land: left these untracked files uncommitted (git add the ones you mean to keep):' >&2
  echo \"$untracked\" >&2
fi
wt pr-auto --stage=tracked
{% elif landing | default(\"\") != \"\" %}
echo \"wt land: --landing must be merge or pr\" >&2
exit 1
{% elif owner | default(\"\") | lower == \"zachbornheimer\" or \"github.com/zachbornheimer/\" in remote_url | default(\"\") | lower or \"github.com:zachbornheimer/\" in remote_url | default(\"\") | lower %}
if ! git diff --quiet || ! git diff --cached --quiet; then
  wt step commit --stage=tracked || exit 1
fi
untracked=$(git ls-files --others --exclude-standard)
if [ -n \"$untracked\" ]; then
  echo 'wt land: left these untracked files uncommitted (git add the ones you mean to keep):' >&2
  echo \"$untracked\" >&2
fi
wt merge --stage=tracked
{% else %}
if ! git diff --quiet || ! git diff --cached --quiet; then
  wt step commit --stage=tracked || exit 1
fi
untracked=$(git ls-files --others --exclude-standard)
if [ -n \"$untracked\" ]; then
  echo 'wt land: left these untracked files uncommitted (git add the ones you mean to keep):' >&2
  echo \"$untracked\" >&2
fi
wt pr-auto --stage=tracked
{% endif %}"""
commit-unstaged = """
if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
  exec wt step commit
fi
wt tree-for-changes -- wt land --landing=merge"""
commit-fix = "~/.local/share/dev-profile/bin/dev-profile-commit-fix step commit {{ args }}"
sync = """
if [ -n \"{{ branch | default(\"\") }}\" ] && [ \"$(git branch --show-current)\" != \"{{ branch | default(\"\") }}\" ]; then
  cd \"$(wt -y switch \"{{ branch | default(\"\") }}\" --no-cd -x pwd)\" || exit 1
fi
for arg in {{ args }}; do
  case \"$arg\" in
  -n|--dry-run|-h|--help|-V|--version) exec wt-sync {{ args }} ;;
  esac
done
count=0
until wt-sync {{ args }}; do
  count=$((count + 1))
  [ \"$count\" -le 5 ] || exit 1
  omp -p --model @task \"Please get branch {{ branch | default(\"\") }} clean and rebased so 'wt-sync {{ args }}' succeeds (attempt $count/5).\"
done"""

[pre-start]
copy = "~/.local/share/dev-profile/bin/dev-profile-worktree-copy"

[post-start]

[post-remove]
reap = "~/.local/share/dev-profile/bin/dev-profile-dev reap {{ worktree_path }}"

[post-switch]
retire-legacy-hooks = "~/.local/share/dev-profile/bin/dev-profile-retire-legacy-hooks"

[pre-merge]
protect-omp-main = """
{% if repo == 'oh-my-pi' and (target == 'main' or target == 'master') %}
echo "Merging into '{{ target }}' in oh-my-pi is forbidden ('main' is a read-only mirror of upstream can1357/oh-my-pi)." >&2
echo "Keep your change on a topic branch and push it to 'fork' first ('git push -u fork {{ branch }}'); a listed branch that is missing from 'fork' fails the whole CI assembly. Then add an entry (branch, reason) to the BRANCH_MANIFEST JSON array in .github/workflows/omp-build.yml on the fork's default branch 'ci' so CI builds the next release; 'mise up' installs it." >&2
exit 1
{% else %}
true
{% endif %}"""

[post-commit]
merge-if-clean = """
{% if branch == 'chore/uncommited' and not target %}
sh -c 'test \"${WT_AUTO_MERGE:-}\" = 1 && exit 0; git merge-base --is-ancestor HEAD {{ default_branch }} && exit 0; git merge-tree --write-tree --quiet {{ default_branch }} HEAD >/dev/null || exit 0; WT_AUTO_MERGE=1 exec wt merge'
{% else %}
true
{% endif %}"""
