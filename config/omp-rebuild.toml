# What goes into the custom oh-my-pi (`omp`) build. Read by `dev-profile-omp-sync`.
#
# Every run rebuilds `omp-build` from scratch: upstream `origin/main` plus each
# branch below, merged in order, then compiles and installs `~/.local/bin/omp`.
# A branch that conflicts (and has no recorded resolution) or a failed build
# exits non-zero and installs nothing; the previous binary keeps running.
#
# - `main` (local and `fork/main`) mirrors upstream `origin/main` exactly; commits
#   on it are blocked. Every custom change lives on its own branch off `origin/main`.
# - Add / remove a branch:  dev-profile-omp-sync --include <branch> --push
#                           dev-profile-omp-sync --exclude <branch> --push
# - When a branch conflicts: rebase it onto origin/main and push it, or resolve the
#   merge once in the build worktree; git rerere replays that resolution every run.

branches = [
  "feat/capability-channel-and-deferral",
  "omp-neon-sessions",
  "feat/sql-session-listing",
  "feat/extension-shake",
  "feat/auto-fallback-shake",
  "feat/isolation-command-backend",
  "feat/fleet-and-xdev-fixes",
  "feat/browser-aria-ref-delegation",
]

# Strings packages/coding-agent/src must contain, or the build is refused:
# SESSIONS_DB_URL is the Neon-backed session storage every machine relies on.
required_in_tree = [
  "SESSIONS_DB_URL",
]
