# Source of truth: profile.pkl
[env]
DEV_PROFILE = "personal"

[env._]
path = ["~/.local/share/dev-profile/bin"]

[settings]
experimental = true

[tools]
dprint = "0.64.3"

[deps.aube]
auto = true

[deps.pnpm]
auto = true

[deps.npm]
auto = true

[deps.bun]
auto = true

[deps.uv]
auto = true

[deps.composer]
auto = true

[deps.bundler]
auto = true

[deps.go]
auto = true

[deps.git-submodule]
auto = true

[deps.cpanm]
auto = true
sources = ["cpanfile"]
run = "if [ -f cpanfile ]; then cpanm --quiet --notest --local-lib local --installdeps .; fi"

[deps.cargo]
auto = true
sources = ["Cargo.toml", "Cargo.lock"]
run = "if [ -f Cargo.toml ]; then cargo fetch; fi"

[deps.swift]
auto = true
sources = ["Package.swift", "Package.resolved"]
run = "if [ -f Package.swift ]; then swift package resolve; fi"

[tasks."profile:setup"]
description = "Install tools and deps (mise deps providers)"
