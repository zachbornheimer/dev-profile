name: ci

# The repo contract on every push and PR: render the profile and run doctor,
# which validates each generated file with the tool that consumes it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: System tools doctor needs
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4 zsh ruby-full perltidy libperl-critic-perl
      - name: Install the profile's tools
        env:
          # mise reads release metadata from the GitHub API; unauthenticated it
          # shares a 60/hour budget with every runner on the same address.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export MISE_GLOBAL_CONFIG_FILE="${GITHUB_WORKSPACE}/config/tools.toml"
          echo "MISE_GLOBAL_CONFIG_FILE=${MISE_GLOBAL_CONFIG_FILE}" >>"$GITHUB_ENV"
          mise install --yes
      - name: Test
        # Pins live in the repo. There is no generate step.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test

  # The published action, run from this checkout, the way a consumer repo uses it
  # (`uses:` then `mise run ci`). The sample repos sit outside every code root.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
      - name: Repo without a go pin gets the profile's go
        run: |
          want="$(sed -n 's/^go = "\(.*\)"$/\1/p' "${HOME}/.config/mise/conf.d/dev-profile.toml")"
          mkdir "${RUNNER_TEMP}/bare"
          cd "${RUNNER_TEMP}/bare" || exit
          printf '[tasks.noop]\nrun = "true"\n' >mise.toml
          mise trust
          got="$(mise exec -- go version)"
          grep -Fq "go${want}." <<<"${got}" || { echo "want go ${want}, got: ${got}" >&2; exit 1; }
      - name: Repo with its own go pin keeps it
        run: |
          mkdir "${RUNNER_TEMP}/pinned"
          cd "${RUNNER_TEMP}/pinned" || exit
          printf '[tools]\ngo = "1.25"\n' >mise.toml
          mise trust
          mise install --yes
          got="$(mise exec -- go version)"
          grep -Fq 'go1.25.' <<<"${got}" || { echo "want go 1.25, got: ${got}" >&2; exit 1; }
      - name: Plain steps find the tools
        run: go version
      - name: The hook tools resolve
        run: |
          mise which markdownlint
          mise which betterleaks
      - name: The committed dprint config checks cleanly
        run: |
          mkdir "${RUNNER_TEMP}/hatch"
          cd "${RUNNER_TEMP}/hatch" || exit
          printf '{\n  "extends": "%s/config/dprint.jsonc",\n  "excludes": ["schemas/"]\n}\n' "${GITHUB_WORKSPACE}" >dprint.jsonc
          printf '{\n  "a": 1\n}\n' >data.json
          dprint check
