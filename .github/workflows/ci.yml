name: ci

# The repo contract on every push and PR: render the profile and run doctor,
# which validates each generated file with the tool that consumes it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: System tools doctor needs
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4 zsh ruby-full
      - name: Install the profile's tools
        env:
          # mise reads release metadata from the GitHub API; unauthenticated it
          # shares a 60/hour budget with every runner on the same address.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="${RUNNER_TEMP}/profile"
          DEV_PROFILE_OUT="${out}" mise run generate
          MISE_GLOBAL_CONFIG_FILE="${out}/mise-profile.toml" mise install --yes
      - name: Test
        # The installed toolset is active only with the rendered profile as
        # mise's global config, the way bootstrap links it.
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ runner.temp }}/profile/mise-profile.toml
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test

  # The published action, run from this checkout, the way a consumer repo uses it
  # (`uses:` then `mise run ci`). The sample repos sit outside every code root.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
      - name: Repo without a go pin gets the profile's go
        run: |
          want="$(sed -n 's/^go = "\(.*\)"$/\1/p' "${HOME}/.local/share/dev-profile/mise-profile.toml")"
          mkdir "${RUNNER_TEMP}/bare"
          cd "${RUNNER_TEMP}/bare"
          printf '[tasks.noop]\nrun = "true"\n' >mise.toml
          mise trust
          got="$(mise exec -- go version)"
          grep -Fq "go${want}." <<<"${got}" || { echo "want go ${want}, got: ${got}" >&2; exit 1; }
      - name: Repo with its own go pin keeps it
        run: |
          mkdir "${RUNNER_TEMP}/pinned"
          cd "${RUNNER_TEMP}/pinned"
          printf '[tools]\ngo = "1.25"\n' >mise.toml
          mise trust
          mise install --yes
          got="$(mise exec -- go version)"
          grep -Fq 'go1.25.' <<<"${got}" || { echo "want go 1.25, got: ${got}" >&2; exit 1; }
      - name: Plain steps find the tools
        run: go version
      - name: Every tool hk invokes resolves, and profile:ci is a task, outside a code root
        run: |
          mkdir "${RUNNER_TEMP}/outside"
          cd "${RUNNER_TEMP}/outside"
          mise tasks --json | jq -e 'any(.[]; .name == "profile:ci")'
          mise which markdownlint
          mise which betterleaks
      - name: The dprint escape hatch resolves and checks cleanly
        run: |
          mkdir "${RUNNER_TEMP}/hatch"
          cd "${RUNNER_TEMP}/hatch"
          printf '{\n  "extends": "~/.local/share/dev-profile/dprint.jsonc",\n  "excludes": ["schemas/"]\n}\n' >dprint.jsonc
          printf '{\n  "a": 1\n}\n' >data.json
          dprint check
      - name: The local entry point resolves the same tools
        run: |
          mkdir "${RUNNER_TEMP}/entry"
          cd "${RUNNER_TEMP}/entry"
          "${HOME}/.local/share/dev-profile/bin/dev-profile-env" -- mise which betterleaks
