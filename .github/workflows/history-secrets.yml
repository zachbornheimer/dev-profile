name: history-secrets

# The `history` branch is mise's dotfile history (README "Live files"), pushed by
# the watcher, which skips git hooks. A push to it cannot trigger a workflow: GitHub
# reads push workflows from the pushed branch, which holds only mise's store. So
# this scans it from main on a schedule. It detects, it does not prevent: mise's own
# pre-push scan and GitHub push protection are the gates. A hit means rotate first,
# then `mise dot history purge`.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Not actions/checkout, for the reason in ci.yml.
      - name: Checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth 1 origin "${SHA}"
          git checkout --detach FETCH_HEAD
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install gitleaks at the profile's pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="${RUNNER_TEMP}/profile"
          DEV_PROFILE_OUT="${out}" mise run generate
          MISE_GLOBAL_CONFIG_FILE="${out}/mise-profile.toml" mise install --yes aqua:gitleaks/gitleaks
      - name: Scan every version on the history branch
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ runner.temp }}/profile/mise-profile.toml
          REPO: ${{ github.repository }}
        run: |
          url="https://github.com/${REPO}.git"
          if [[ -z "$(git ls-remote --heads "${url}" history)" ]]; then
            echo "no history branch yet"
            exit 0
          fi
          history="${RUNNER_TEMP}/history"
          git init -q "${history}"
          git -C "${history}" fetch -q "${url}" "+refs/heads/history:refs/heads/history"
          mise exec -- gitleaks git --redact --no-banner --log-opts="history" "${history}"
