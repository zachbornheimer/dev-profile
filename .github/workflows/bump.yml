name: bump

# Weekly: bump every outdated pin to its latest release and open a PR with the
# diff, armed to merge itself once ci passes on it. `mise run bump` does the
# bumping. A PR opened with the workflow token does not trigger ci by itself,
# so this dispatches ci on the branch; the main ruleset requires its `test`
# check, and auto-merge waits for it.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Bump outdated pins
        id: bump
        run: |
          BUMP_SUMMARY="${RUNNER_TEMP}/summary.md" mise run bump
          if [ -s "${RUNNER_TEMP}/summary.md" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "Weekly pin bump from \`mise run bump\`."
              echo
              cat "${RUNNER_TEMP}/summary.md"
              echo
              echo "ci runs doctor on this PR; it merges itself when the \`test\` check passes."
            } > "${RUNNER_TEMP}/body.md"
          fi
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        if: steps.bump.outputs.changed == 'true'
        with:
          branch: chore/bump-pins
          title: "chore(tools): bump the outdated pins"
          commit-message: "chore(tools): bump the outdated pins"
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true
      - name: Run ci on the PR and arm auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml --ref chore/bump-pins
          gh pr merge "${PR}" --auto --merge
