# agents/agents/*.yaml are generated by import_mastra.py, which writes a sequence item at
# its key's own indentation (`tags:` then `- x`) instead of indenting it one level. Setting
# `indent-sequences: false` describes exactly that, so the generated files lint as written
# instead of being hand-edited and then regenerated back.
rules:
  indentation:
    spaces: 2
    indent-sequences: false
