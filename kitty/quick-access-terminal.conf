# Config for kitty's drop-down ("quake") terminal — a terminal that slides in
# from the top of the screen on a global hotkey, for quick one-offs, then hides.
#
# Launch it with:  kitten quick-access-terminal
# Bind that command to a global hotkey to get the drop-down behavior. You already
# use Raycast — add a Script Command / hotkey that runs:
#   /Applications/kitty.app/Contents/MacOS/kitten quick-access-terminal
# The first invocation creates it; later invocations toggle visibility.

lines 24
columns 0
edge top
margin_left 0
margin_right 0
background_opacity 0.96
hide_on_focus_loss yes
start_as_hidden no
