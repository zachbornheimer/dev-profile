# open-actions.conf — what kitty does when you click a file:// hyperlink in the
# terminal. (Kitty only makes a path clickable when a program emits it as a real
# OSC 8 hyperlink — e.g. `eza --hyperlink`, `rg --hyperlink-format=kitty`, fzf,
# lazygit. Bare paths in plain output are NOT clickable; use the cmd+shift+e /
# cmd+shift+f hints in kitty.conf for those.)
#
# Rules are matched top-to-bottom; the first match wins.

# Images, video, audio, PDFs — leave to the macOS default app, not nvim.
protocol file
mime image/*, video/*, audio/*, application/pdf
action launch --type=os-window open ${FILE_PATH}

# File link carrying a line number fragment (#NN) — e.g. a clicked
# `rg --hyperlink-format=kitty` match — open nvim AT that line, new tab.
protocol file
url .*#[0-9]+$
action launch --type=tab --tab-title=nvim -- nvim -- +${FRAGMENT} ${FILE_PATH}

# Everything else (source, config, text, no extension) — open nvim on the file,
# new tab in the kitty window you clicked from. ${FILE_PATH} is absolute, so the
# editor lands on the right file regardless of cwd.
protocol file
action launch --type=tab --tab-title=nvim -- nvim -- ${FILE_PATH}
