# Map a running executable to a tab icon.
#
# Kitty reports the foreground process basename (uv, nvim, python3.14).
# Put that name on the left. Put an icon name from [icons] on the right,
# or a Nerd Font codepoint (U+E73C).
#
# Reload with: kitten @ load-config
#
# Grok has no glyph in Nerd Fonts 3.5.1 — add one here when it does.

[exe]
# Python
python = python
python3 = python
pythonw = python
pypy = python
pypy3 = python
uv = python
uvx = python
poetry = python
pip = python
pip3 = python
pipx = python
pytest = python
ipython = python
ipython3 = python
jupyter = python
jupyter-lab = python
jupyter-notebook = python
tox = python
nox = python
pdm = python
rye = python
hatch = python
conda = python
mamba = python
pixi = python
ruff = python
ty = python

# Editors / agents
nvim = neovim
vi = vim
vim = vim
claude = claude
codex = openai
chatgpt = openai
cursor = cursor
copilot = copilot
code = vscode

# JS
node = nodejs
nodejs = nodejs
npm = nodejs
npx = nodejs
yarn = nodejs
pnpm = nodejs
bun = bun

# Other languages / tools
git = git
docker = docker
ssh = ssh
go = go
gopls = go
ruby = ruby
irb = ruby
cargo = rust
rustc = rust

[icons]
# Nerd Fonts 3.5.1. Names are what [exe] points at.
python = U+E73C
neovim = U+E6AE
vim = U+E62B
claude = U+EC82
openai = U+EC81
copilot = U+EC1E
cursor = U+EC5C
nodejs = U+E718
bun = U+E76F
git = U+E702
docker = U+F0868
ssh = U+F08C0
go = U+E626
ruby = U+E739
rust = U+E7A8
vscode = U+EC29
