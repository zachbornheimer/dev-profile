# agentmux-compat.conf — managed by agentmux (setup-terminal / auto on resume)
# Force CSI-u for Shift/Ctrl+Enter so Grok/Claude/Codex work inside tmux.
# tmux cannot forward Kitty keyboard protocol push/pop; without these maps
# the outer terminal collapses Shift+Enter → Enter and agent multiline fails.
#
# Applied live via SIGUSR1 / kitten @ load-config when agentmux can; otherwise
# reload Kitty (ctrl+shift+f5) once.
map shift+enter  send_text all \x1b[13;2u
map shift+return send_text all \x1b[13;2u
map ctrl+enter   send_text all \x1b[13;5u
map ctrl+return  send_text all \x1b[13;5u
