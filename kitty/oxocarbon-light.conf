# Oxocarbon Light — kitty
# A high-contrast, daylight-friendly adaptation of Oxocarbon.
# Inspired by: https://github.com/hbjydev/oxocarbon-kitty
# Keep dark ANSI colors readable on pale backgrounds; reserve vivid pink for chrome.

# Core: cool paper background with near-black text.
foreground              #161616
background              #f2f4f8
background_opacity      1.0
selection_foreground    #161616
selection_background    #dde1e6
cursor                  #161616
cursor_text_color       background

# Links, split borders, and attention state.
url_color               #a21952
url_style               single
active_border_color     #ee5396
inactive_border_color   #c6c6c6
bell_border_color       #ee5396

# Browser-style tabs: colors only. Geometry lives in browser-tabs.conf.
active_tab_foreground   #161616
active_tab_background   #ee5396
inactive_tab_foreground #525252
inactive_tab_background #dde1e6
tab_bar_background      #f2f4f8
tab_bar_margin_color    #f2f4f8

# Native chrome: light on macOS; matching background on Wayland.
macos_titlebar_color    light
wayland_titlebar_color  background

# ANSI palette: darkened Oxocarbon accents for contrast on light backgrounds.
# Black and bright black.
color0  #262626
color8  #697077

# Red / pink.
color1  #b91c55
color9  #d12765

# Green.
color2  #0e6f34
color10 #198038

# Yellow slot: Oxocarbon's blue-leaning sky accent.
color3  #005a9e
color11 #0072c3

# Blue.
color4  #0043ce
color12 #0f62fe

# Magenta.
color5  #8a184a
color13 #a21952

# Cyan.
color6  #006764
color14 #007d79

# White / bright white: dark grays stay legible on a light canvas.
color7  #525252
color15 #161616

# vim:ft=conf
