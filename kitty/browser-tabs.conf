# Browser-inspired tabs for kitty (Oxocarbon Light).
# Pink #ee5396 = current tab. Gray #dde1e6 = every other tab.
# Title is a nerd-font icon for the process plus a short name
# (rename, grok task, or cwd basename). No process-name text.
# Exe → icon map: tab-icons.conf.

# Spacious terminal text area.
window_padding_width     12

# Tab bar above the terminal, always visible, with a clickable + button.
# tab_bar.py paints equal-width tabs that fill this bar. Slant/powerline
# styles shrink to the title and leave the rest of the bar empty.
tab_bar_edge             top
tab_bar_style            custom
tab_bar_align            start
tab_bar_min_tabs         1
tab_bar_show_new_tab_button yes

# Small gutters around the tabs; custom draw_title keeps names short.
tab_bar_margin_width     8.0
tab_bar_margin_height    5.0 6.0
tab_title_max_length     0
tab_title_template       "{bell_symbol}{activity_symbol}{custom}"
tab_activity_symbol      none
bell_on_tab              no
active_tab_font_style    bold
inactive_tab_font_style  normal

# Keep native macOS titlebar and window controls visible.
#hide_window_decorations  no

# Nerd glyphs for tab_bar.py. Main text stays Ioskeley Mono.
symbol_map U+E000-U+F8FF FiraCode Nerd Font Mono
symbol_map U+F0000-U+F1FFF FiraCode Nerd Font Mono

# Tab picker. cmd+shift+r still renames (set_tab_title in kitty.conf).
map cmd+shift+l          select_tab
