<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--color-bg-page);font-family:var(--font-sans);font-size:var(--text-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.preview{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20)}
.row{display:flex;gap:var(--space-20);flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start}
.lbl{font-size:var(--text-meta);color:var(--color-text-muted)}
.mono{font-family:var(--font-mono);font-size:var(--text-mono)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:var(--space-20);display:flex;flex-direction:column;gap:var(--space-12)}
.card h2{margin:0;font-size:var(--text-section-title);font-weight:var(--weight-semibold)}
.card p{margin:0;font-size:var(--text-body);line-height:var(--leading-prose);color:var(--color-text-secondary)}
.field{display:flex;flex-direction:column;gap:var(--space-6);font-size:var(--text-body);font-weight:var(--weight-medium);width:280px}
.field .help{font-size:var(--text-meta);font-weight:var(--weight-regular);color:var(--color-text-muted)}
.input,.select{font:inherit;font-size:var(--text-body);padding:7px var(--space-10);border:1px solid var(--color-border-input);border-radius:var(--radius-control);background:var(--color-surface);color:var(--color-text);width:100%}
.select{padding:7px var(--space-8)}
.input.mono{font-family:var(--font-mono)}
.input:focus{outline:2px solid var(--color-accent);outline-offset:0;border-color:var(--color-accent)}
.switch{position:relative;width:36px;height:var(--layout-control-height);border-radius:var(--radius-pill);border:0;padding:0;background:var(--color-switch-off);flex:none}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--color-surface);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--color-accent)}.switch.on i{left:18px}
.choice{display:flex;gap:var(--space-12);align-items:flex-start;padding:var(--space-14) var(--space-16);border-radius:var(--radius-card);border:1px solid var(--color-border);background:var(--color-surface);width:300px}
.choice.sel{border-color:var(--color-accent);background:var(--color-accent-bg)}
.choice .ring{flex:none;width:16px;height:16px;border-radius:50%;border:1px solid var(--color-border-input);background:var(--color-surface);margin-top:1px}
.choice.sel .ring{border:5px solid var(--color-accent)}
.choice b{font-size:var(--text-body);font-weight:var(--weight-semibold);display:block}
.choice small{font-size:var(--text-meta);color:var(--color-text-secondary)}
</style></head>
<body><div class="preview">
<div class="row"><div class="cell"><span class="lbl">Closed</span><div class="field"><select class="select"><option>Organization</option></select></div></div><div class="cell"><span class="lbl">With help text</span><div class="field"><select class="select"><option>Featured image, then logo</option></select><span class="help">Using: site logo</span></div></div></div>
</div></body></html>
