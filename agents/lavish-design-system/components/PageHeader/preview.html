<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageHeader</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--color-bg-page);font-family:var(--font-sans);font-size:var(--text-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.preview{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20)}
.row{display:flex;gap:var(--space-20);flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start}
.lbl{font-size:var(--text-meta);color:var(--color-text-muted)}
.mono{font-family:var(--font-mono);font-size:var(--text-mono)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:var(--space-20);display:flex;flex-direction:column;gap:var(--space-12)}
.card h2{margin:0;font-size:var(--text-section-title);font-weight:var(--weight-semibold)}
.card p{margin:0;font-size:var(--text-body);line-height:var(--leading-prose);color:var(--color-text-secondary)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-16);flex-wrap:wrap}
.hdr h1{margin:0;font-size:var(--text-page-title);font-weight:var(--weight-medium);letter-spacing:var(--tracking-title)}.hdr .meta{font-size:var(--text-body);color:var(--color-text-muted);margin-top:var(--space-4)}
.pill{display:inline-flex;align-items:center;gap:var(--space-8);font-size:var(--text-meta);font-weight:var(--weight-semibold);padding:5px var(--space-10) 5px var(--space-8);border-radius:var(--radius-pill)}
.pill i{width:8px;height:8px;border-radius:50%}
.pill.on{background:var(--color-success-bg);color:var(--color-success-text)}.pill.on i{background:var(--color-success)}
.pill.off{background:var(--color-bg-page);color:var(--color-text-secondary)}.pill.off i{background:var(--color-text-faint)}
.tabs{display:flex;gap:var(--space-4);border-bottom:1px solid var(--color-border)}
.tabs button{font:inherit;font-size:var(--text-body);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:var(--space-8) var(--space-12);cursor:pointer;color:var(--color-text-secondary)}
.tabs button.on{font-weight:var(--weight-semibold);color:var(--color-text);border-bottom-color:var(--color-accent)}
</style></head>
<body><div class="preview">
<div class="hdr"><div><h1>Site Performance</h1><div class="meta">Last saved 1 minute ago · 13 routes · 20 over-budget requests in the last 12 minutes</div></div><div class="pill on"><i></i>Monitoring on</div></div><div style="display:flex;flex-direction:column;gap:var(--space-14)"><div class="hdr"><div><h1>SEO</h1><div class="meta">Checked just now · 374 pages</div></div><div class="pill on"><i></i>Automatic SEO on</div></div><div class="tabs"><button class="on">Overview</button><button class="">Settings</button><button class="">AI Assistant</button><button class="">Tools</button></div></div>
</div></body></html>
