<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UsageMeter</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--color-bg-page);font-family:var(--font-sans);font-size:var(--text-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.preview{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20)}
.row{display:flex;gap:var(--space-20);flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start}
.lbl{font-size:var(--text-meta);color:var(--color-text-muted)}
.mono{font-family:var(--font-mono);font-size:var(--text-mono)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:var(--space-20);display:flex;flex-direction:column;gap:var(--space-12)}
.card h2{margin:0;font-size:var(--text-section-title);font-weight:var(--weight-semibold)}
.card p{margin:0;font-size:var(--text-body);line-height:var(--leading-prose);color:var(--color-text-secondary)}
.meter{height:6px;background:var(--color-bg-page);border-radius:var(--radius-pill);overflow:hidden;width:320px}.meter div{height:100%;background:var(--color-accent)}
</style></head>
<body><div class="preview">
<div style="display:flex;flex-direction:column;gap:var(--space-8)"><span style="font-size:var(--text-body)"><b style="font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums">$1.84</b> <span class="lbl">this month · limit $10</span></span><div class="meter"><div style="width:18.4%"></div></div><span class="lbl">Last run 2:14 AM, 374 pages read. It stops when the limit is reached.</span></div>
</div></body></html>
