<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stepper</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--color-bg-page);font-family:var(--font-sans);font-size:var(--text-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.preview{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20)}
.row{display:flex;gap:var(--space-20);flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start}
.lbl{font-size:var(--text-meta);color:var(--color-text-muted)}
.mono{font-family:var(--font-mono);font-size:var(--text-mono)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:var(--space-20);display:flex;flex-direction:column;gap:var(--space-12)}
.card h2{margin:0;font-size:var(--text-section-title);font-weight:var(--weight-semibold)}
.card p{margin:0;font-size:var(--text-body);line-height:var(--leading-prose);color:var(--color-text-secondary)}
.steps{display:flex;gap:var(--space-4)}.step{display:flex;align-items:center;gap:var(--space-8);padding-right:var(--space-16);font-size:var(--text-body);color:var(--color-text-muted)}
.step i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:var(--text-meta);font-weight:var(--weight-semibold);background:var(--color-bg-page);color:var(--color-text-muted)}
.step.cur,.step.done{color:var(--color-text)}.step.cur{font-weight:var(--weight-semibold)}.step.cur i,.step.done i{background:var(--color-accent);color:var(--color-on-accent)}
</style></head>
<body><div class="preview">
<div class="card" style="max-width:560px"><div class="steps"><div class="step done"><i>✓</i>Provider</div><div class="step cur"><i>2</i>API key</div><div class="step"><i>3</i>Consent</div></div></div>
</div></body></html>
