<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--color-bg-page);font-family:var(--font-sans);font-size:var(--text-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.preview{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20)}
.row{display:flex;gap:var(--space-20);flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start}
.lbl{font-size:var(--text-meta);color:var(--color-text-muted)}
.mono{font-family:var(--font-mono);font-size:var(--text-mono)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:var(--space-20);display:flex;flex-direction:column;gap:var(--space-12)}
.card h2{margin:0;font-size:var(--text-section-title);font-weight:var(--weight-semibold)}
.card p{margin:0;font-size:var(--text-body);line-height:var(--leading-prose);color:var(--color-text-secondary)}
.btn{font:inherit;font-size:var(--text-body);font-weight:var(--weight-medium);padding:7px var(--space-14);border-radius:var(--radius-control);cursor:pointer;border:1px solid var(--color-accent);background:var(--color-surface);color:var(--color-accent)}
.btn.hover{background:var(--color-accent-bg)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent)}
.btn.neutral{border-color:var(--color-border-control);color:var(--color-text)}
.btn.danger{border-color:var(--color-error-text);color:var(--color-error-text)}
.btn.sm{font-size:var(--text-meta);padding:4px var(--space-10)}
.btn:disabled{background:var(--color-accent-disabled);border-color:var(--color-accent-disabled);color:var(--color-on-accent);cursor:not-allowed}
.btn-link{font:inherit;font-size:var(--text-body);border:0;background:none;color:var(--color-accent);cursor:pointer;padding:0}
.btn-link.danger{color:var(--color-error-text)}
</style></head>
<body><div class="preview">
<div class="row"><div class="cell"><span class="lbl">Primary filled</span><button class="btn primary">Connect AI</button></div><div class="cell"><span class="lbl">Secondary outline</span><button class="btn">Turn monitoring off</button></div><div class="cell"><span class="lbl">Secondary, hover (accent-bg fill)</span><button class="btn hover">Turn monitoring off</button></div><div class="cell"><span class="lbl">Neutral</span><button class="btn neutral">Discard</button></div><div class="cell"><span class="lbl">Destructive outline</span><button class="btn danger">Delete…</button></div><div class="cell"><span class="lbl">Small</span><button class="btn sm">Choose a different image</button></div><div class="cell"><span class="lbl">Disabled</span><button class="btn primary" disabled>Continue</button></div><div class="cell"><span class="lbl">Link-button</span><button class="btn-link">Show all 20 requests</button></div><div class="cell"><span class="lbl">Link-button, destructive</span><button class="btn-link danger">Disconnect</button></div></div><span class="lbl">Hover: secondary gains the accent-bg fill. Disabled uses accent-disabled, never opacity.</span>
</div></body></html>
