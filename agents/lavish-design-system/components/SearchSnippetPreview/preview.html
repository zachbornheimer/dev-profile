<!-- @dsCard group="Data" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SearchSnippetPreview</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--color-bg-page);font-family:var(--font-sans);font-size:var(--text-body);color:var(--color-text);-webkit-font-smoothing:antialiased}
.preview{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-20)}
.row{display:flex;gap:var(--space-20);flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start}
.lbl{font-size:var(--text-meta);color:var(--color-text-muted)}
.mono{font-family:var(--font-mono);font-size:var(--text-mono)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:var(--space-20);display:flex;flex-direction:column;gap:var(--space-12)}
.card h2{margin:0;font-size:var(--text-section-title);font-weight:var(--weight-semibold)}
.card p{margin:0;font-size:var(--text-body);line-height:var(--leading-prose);color:var(--color-text-secondary)}
.serp{background:var(--color-surface);border-radius:var(--radius-control);padding:var(--space-12) var(--space-14);display:flex;flex-direction:column;gap:var(--space-4);max-width:560px}
.serp .u{font-size:var(--text-meta);color:var(--color-text-secondary)}.serp .t{font-size:var(--text-serp-title);color:var(--color-serp-title);line-height:var(--leading-tight)}.serp .d{font-size:var(--text-body);color:var(--color-serp-desc);line-height:var(--leading-body)}
.serpwrap{border:1px solid var(--color-divider);background:var(--color-surface-subtle);border-radius:var(--radius-card);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-8);max-width:620px}
.btn{font:inherit;font-size:var(--text-body);font-weight:var(--weight-medium);padding:7px var(--space-14);border-radius:var(--radius-control);cursor:pointer;border:1px solid var(--color-accent);background:var(--color-surface);color:var(--color-accent)}
.btn.hover{background:var(--color-accent-bg)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent)}
.btn.neutral{border-color:var(--color-border-control);color:var(--color-text)}
.btn.danger{border-color:var(--color-error-text);color:var(--color-error-text)}
.btn.sm{font-size:var(--text-meta);padding:4px var(--space-10)}
.btn:disabled{background:var(--color-accent-disabled);border-color:var(--color-accent-disabled);color:var(--color-on-accent);cursor:not-allowed}
.btn-link{font:inherit;font-size:var(--text-body);border:0;background:none;color:var(--color-accent);cursor:pointer;padding:0}
.btn-link.danger{color:var(--color-error-text)}
.type{font-size:var(--text-badge);font-weight:var(--weight-semibold);text-transform:uppercase;letter-spacing:var(--tracking-badge);color:var(--color-text-secondary);background:var(--color-bg-page);border-radius:var(--radius-badge);padding:2px var(--space-6);display:inline-block;min-width:48px;text-align:center}
.tag{font-size:var(--text-badge);font-weight:var(--weight-semibold);border-radius:var(--radius-badge);padding:2px var(--space-6);display:inline-block}
.tag.warn{color:var(--color-warning-text);background:var(--color-warning-bg)}.tag.ok{color:var(--color-success-text);background:var(--color-success-bg)}
.tag.outline{color:var(--color-text-secondary);background:var(--color-surface);border:1px solid var(--color-border);padding:1px var(--space-6)}
.ratio{font-size:var(--text-meta);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;padding:2px var(--space-8);border-radius:var(--radius-pill);display:inline-block}
.ratio.warn{background:var(--color-warning-bg);color:var(--color-warning-text)}.ratio.hot{background:var(--color-error-bg);color:var(--color-error-text)}
</style></head>
<body><div class="preview">
<div class="serpwrap"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">Example from your Home page</span><span class="tag outline">Custom description</span></div><div class="serp"><span class="u">isjac.org</span><span class="t">ISJAC | International Society of Jazz Arrangers and Composers</span><span class="d">ISJAC is the international nonprofit for jazz arrangers and composers. Award funding, performance opportunities, education, and a global community.</span></div><div><button class="btn sm" style="font-size:var(--text-body)">Customize</button></div></div>
</div></body></html>
