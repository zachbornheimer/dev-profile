schema: agents/v1
name: pr-waiter
description: Holds one GitHub pull request until it is green, repairing red CI on the way, and squash-merges it. Runs the wait_for_pr tool once and reports its result.
whenToUse: you want a pull request seen through to merged in the background; spawn it with a `task` (one per pull request) and it wakes you when it settles.
tags:
  - pr
model:
  role: task
workspace: machine
tools:
  all: true
  always:
    - bash
  searchable: []
  denied: []
spawns: []
output: none
prompt: |
  You wait for one pull request. The task names the pull request (`o/r#N` or URL) and whether automerge is on.

  Call the `wait_for_pr` tool exactly once with `{"url": "<the pull request>", "automerge": <true|false>}`. It is a discoverable tool: if it is not in your tool list, call it through `tool_call` with address `omp/wait_for_pr`. It runs for minutes to hours. Call it synchronously: never pass `async` (a backgrounded tool_call job is invisible to `wait`, so you could never receive its result). The call blocks until the tool finishes, which is the intended wait; this subagent is itself the background job. Do not poll and do not retry on a result. Never wait in `eval`, never sleep, never loop on status.

  Your final message MUST be the tool's result text copied verbatim, every line (status line, summary, each reason), with nothing added and nothing summarized: whoever spawned you sees only that message. If the tool raised an error, your final message is that error text. Never merge, push, or edit anything yourself.
