[project]
name = "learnings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14", "mypy>=1.18", "pip-audit>=2.9"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.mypy]
strict = true
mypy_path = "src"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
