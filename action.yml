name: dev-profile
description: >-
  Give a CI runner the same mise tool pins a developer Mac gets from
  `mise bootstrap --from` this profile. Repo-local mise.toml still overrides.
author: zachbornheimer

inputs:
  github-token:
    description: Token mise uses to read release metadata (avoids the unauthenticated rate limit).
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install: false
        cache: false

    # Same code path as bootstrap: `mise run generate` renders profile.pkl, and
    # mise-profile.toml is the file bootstrap links to conf.d/dev-profile.toml.
    - name: Render the profile
      id: render
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/dev-profile"
        cd "${ACTION_PATH}"
        mise trust
        mise install --yes
        DEV_PROFILE_OUT="${out}" mise run generate
        {
          echo "config=${out}/mise-profile.toml"
          echo "key=dev-profile-${RUNNER_OS}-${RUNNER_ARCH}-$(shasum -a 256 "${out}/mise-profile.toml" | cut -c1-16)"
        } >>"${GITHUB_OUTPUT}"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs
        key: ${{ steps.render.outputs.key }}

    # A repo's own mise.toml layers over this global file, so its pins win.
    - name: Install the profile's tools
      shell: bash
      env:
        MISE_GLOBAL_CONFIG_FILE: ${{ steps.render.outputs.config }}
        MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        {
          echo "MISE_GLOBAL_CONFIG_FILE=${MISE_GLOBAL_CONFIG_FILE}"
          echo "MISE_TRUSTED_CONFIG_PATHS=${MISE_TRUSTED_CONFIG_PATHS}"
        } >>"${GITHUB_ENV}"
        mise install --yes
        # Plain `run:` steps find the tools too, not only `mise run` / `mise x`.
        while IFS= read -r tool_bin; do
          if [[ -d "${tool_bin}" ]]; then echo "${tool_bin}"; fi
        done < <(mise bin-paths) >>"${GITHUB_PATH}"
