version = 1

[settings]
max_concurrency = 32
default_timeout = "30s"

[defaults]
agents = ["claude", "codex", "gemini", "grok", "hermes", "copilot", "opencode", "mastra"]
protocol = "native"
shell = true
timeout = "30s"

[[hooks]]
name = "elicitationresult-aoe-status-sh"
events = ["ElicitationResult", "prompt.submit"]
command = ["/Users/zbornheimer/.agents/hooks/aoe-status.sh running"]
timeout = "2s"

[[hooks]]
name = "notification-aoe-status-sh"
events = ["Notification"]
command = ["/Users/zbornheimer/.agents/hooks/aoe-status.sh waiting"]
timeout = "2s"
matcher = "permission_prompt|elicitation_dialog|agent_needs_input"

[[hooks]]
name = "notification-aoe-status-sh-2"
events = ["Notification"]
command = ["/Users/zbornheimer/.agents/hooks/aoe-status.sh idle"]
timeout = "2s"
matcher = "idle_prompt|agent_completed"

[[hooks]]
name = "posttooluse-bash-signature-record"
events = ["tool.after", "PostToolUseFailure"]
policy = "record-bash-signature"
timeout = "5s"
matcher = "Bash"

[[hooks]]
name = "posttooluse-output-budget"
events = ["tool.after"]
policy = "output-budget"
timeout = "5s"
matcher = "Bash"

[[hooks]]
name = "posttooluse-edit-record"
events = ["tool.after"]
policy = "record-edit"
timeout = "5s"
matcher = "Edit|Write"

[[hooks]]
name = "posttooluse-agent-spawn-record"
events = ["tool.after"]
policy = "record-agent-spawn"
timeout = "5s"
matcher = "Agent|Task"

[[hooks]]
name = "posttooluse-work-order-report-py"
events = ["tool.after"]
command = ["/Users/zbornheimer/.agents/hooks/work-order-report.py"]
timeout = "60s"
matcher = "Agent|Task"

[[hooks]]
name = "posttooluse-aoe-status-sh"
events = ["tool.after"]
command = ["/Users/zbornheimer/.agents/hooks/aoe-status.sh running"]
timeout = "2s"
matcher = "AskUserQuestion"

# Semgrep Guardian scans each file Claude writes. Findings come back as
# PostToolUse `decision: "block"`, which agent-hooks hands to the model as
# feedback (agent-hooks >= the fix-posttooluse-block-feedback change).
# `-a claude` parses Claude's payload shape, so other harnesses are excluded.
[[hooks]]
name = "posttooluse-semgrep-guardian"
events = ["tool.after"]
command = ["/Users/zbornheimer/.local/bin/semgrep mcp -k post-tool-cli-scan -a claude"]
timeout = "180s"
matcher = "Write|Edit|MultiEdit"
agents = ["claude"]

[[hooks]]
name = "precompact-goals-note-compaction-py"
events = ["context.compact.before"]
command = ["/Users/zbornheimer/.agents/hooks/goals-note-compaction.py"]
timeout = "15s"
# No matcher: see precompact-agentmux. A "manual|auto" filter only ever excluded payloads with
# no trigger value, i.e. it could only turn a compaction into a silent miss.

[[hooks]]
name = "precompact-agentmux"
events = ["context.compact.before"]
command = ["agentmux save-transcript --harness \"$AGENT_HOOKS_HARNESS\" --hook-payload"]
timeout = "15s"
# No matcher: agent-hooks tests `trigger` (Claude, Codex, Copilot, Gemini) or `source` (Grok)
# and the OpenCode bridge sends neither, so "manual|auto" would silently skip OpenCode.

[[hooks]]
name = "pretooluse-quality-guard-run-py"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/quality-guard-run.py --mode=fast"]
timeout = "15s"
matcher = "Edit|Write|Update|MultiEdit"
on_failure = "block"

[[hooks]]
name = "pretooluse-quality-guard-run-py-2"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/quality-guard-run.py --mode=pretool-review"]
timeout = "15s"
matcher = "Edit|Write|Update|MultiEdit"
on_failure = "block"

[[hooks]]
name = "pretooluse-work-order-gate-py"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/work-order-gate.py"]
timeout = "15s"
matcher = "Agent|Task"
on_failure = "block"

[[hooks]]
name = "pretooluse-subagent-model-guard"
events = ["tool.before"]
policy = "subagent-model-guard"
timeout = "5s"
matcher = "Agent|Task"
on_failure = "block"

[[hooks]]
name = "pretooluse-bash-tool-steer"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/bash-tool-steer.py"]
timeout = "15s"
matcher = "Bash|bash|sh|zsh|shell|terminal|exec|run_terminal_cmd|run_terminal_command"
on_failure = "block"

# Raw `lavish-axi <file>.html` opens skip the preflight gate (at-51q2ph /
# MI-001): the editor's layout detector then reports only to the human's
# warning badge and broken artifacts reach the user unread. Steer to
# `lavish-preflight <file>`. Limitation: omp invokes run_command as
# `write xd://…` and the bridge passes the raw tool name, so tool-name
# matchers may never fire there — the lavish skill text is omp's
# enforcement; this covers the harnesses agent-hooks tool.before reaches.
[[hooks]]
name = "pretooluse-lavish-preflight-steer"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/lavish-preflight-steer.py"]
timeout = "15s"
matcher = "Bash|bash|sh|zsh|shell|terminal|exec|run_terminal_cmd|run_terminal_command|mcp__capability__agentmux_capability_run_command|agentmux_capability_run_command"
on_failure = "block"

# AGENTS.md's promotion gate says one entry per distinct mechanism. Nothing
# enforced it, so a learning cycle appended a thirteenth restatement of a
# lesson already wired twice. This denies a new skill whose mechanism an
# existing skill already owns. Deliberately not on_failure = "block": a broken
# gate must not wedge every write.
[[hooks]]
name = "pretooluse-promotion-gate"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/promotion-gate.py"]
timeout = "10s"
matcher = "Write|Edit|MultiEdit|NotebookEdit"

[[hooks]]
name = "pretooluse-ghx-reminder"
events = ["tool.before"]
policy = "ghx-reminder"
timeout = "5s"
matcher = "Bash"

[[hooks]]
name = "pretooluse-two-strikes-gate"
events = ["tool.before"]
policy = "two-strikes-gate"
timeout = "5s"
matcher = "Bash|Edit|Write|Agent|Task"
on_failure = "block"

[[hooks]]
name = "pretooluse-gate-bypass-tripwire"
events = ["tool.before"]
policy = "gate-bypass-tripwire"
timeout = "5s"
matcher = "Bash"
on_failure = "block"

[[hooks]]
name = "pretooluse-gate-bypass-tripwire-write"
events = ["tool.before"]
policy = "gate-bypass-tripwire"
timeout = "5s"
matcher = "Edit|Write"
on_failure = "block"

[[hooks]]
name = "pretooluse-layout-guard"
events = ["tool.before"]
policy = "layout-guard"
timeout = "5s"
matcher = "Bash"
on_failure = "block"

# `policy = "..."` rows have no command, and agent-hooks dispatch skips a
# hook without one (config.rs validate: "Native policy rows ... Dispatch
# skips them"), so this guard was inert until it named its script. The
# matcher is exact-name, so the run_command spellings are listed: hook_common
# aliases them to Bash and the guard then reads their `command`.
[[hooks]]
name = "pretooluse-search-scope-guard"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/search-scope-guard.py"]
timeout = "5s"
matcher = "Bash|Glob|Grep|glob|grep|mcp__capability__agentmux_capability_run_command|agentmux_capability_run_command"
on_failure = "block"

[[hooks]]
name = "pretooluse-process-kill-guard"
events = ["tool.before"]
policy = "process-kill-guard"
matcher = "Bash"
timeout = "5s"
on_failure = "block"

[[hooks]]
name = "pretooluse-layout-guard-write"
events = ["tool.before"]
policy = "layout-guard"
timeout = "5s"
matcher = "Write|Edit"
on_failure = "block"

[[hooks]]
name = "pretooluse-worktree-write-guard-py"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/worktree-write-guard.py"]
timeout = "10s"
matcher = "Write|Edit"
on_failure = "block"

[[hooks]]
name = "pretooluse-shared-checkout-guard-py"
events = ["tool.before"]
command = ["/Users/zbornheimer/.agents/hooks/shared-checkout-guard.py"]
