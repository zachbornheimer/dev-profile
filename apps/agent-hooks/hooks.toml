# No matcher: agent-hooks tests `trigger` (Claude, Codex, Copilot, Gemini) or `source` (Grok)
# and the OpenCode bridge sends neither, so "manual|auto" would silently skip OpenCode.

# Rewrites <state dir>/handoff/<harness>-<session id>.md from the session's transcript (mastra
# create_session_handoff_doc, no model call) so the takeover doc matches the session as of its latest
# compaction. ~11 s per run, concurrent with the other compaction hooks; a slow or failed render keeps
# the previous doc. No matcher, for the reason given at precompact-agentmux.
[[hooks]]
name = "precompact-handoff-doc-refresh"
events = ["context.compact.before"]
command = ["/Users/zbornheimer/.agents/hooks/handoff-doc-refresh.py"]
timeout = "30s"

