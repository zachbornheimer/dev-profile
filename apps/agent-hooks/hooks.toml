# A long dictated prompt gets a structured copy as additionalContext (a prompt hook cannot replace the message).
# Tunables are environment variables read by the script: DICTATION_REWRITE_TOKEN_LIMIT (default 500, counted with
# `tokuin --model gpt-4`) and DICTATION_REWRITE_MIN_SCORE (default 0.5). Any failure leaves the original input alone.
[[hooks]]
name = "userpromptsubmit-dictation-rewrite-py"
events = ["prompt.submit"]
command = ["/Users/zbornheimer/.agents/hooks/dictation-rewrite.py"]
timeout = "60s"

# Questions about the prompt itself, asked in one call, then routed. It adds no context, so it
# does not have to be last; the capability XML hook below must stay the last prompt.submit hook.
[[hooks]]
name = "userpromptsubmit-prompt-respond"
events = ["prompt.submit"]
command = ["/Users/zbornheimer/.agents/hooks/prompt-respond.py"]
timeout = "35s"
on_failure = "warn"

# This hook must stay last among prompt.submit hooks: agent-hooks concatenates each hook's additionalContext in
# config order, so this runner's capability XML is the final block the agent receives, after intent, project and
# the atask context. The runner applies nested-run-guard internally and prints the XML as additionalContext.
[[hooks]]
name = "userpromptsubmit-capability-xml-sh"
events = ["prompt.submit"]
command = ["/Users/zbornheimer/.agents/hooks/prompt-submit-capabilities.sh"]
timeout = "45s"

# A denied shell tool is a routing signal: the hook injects the one instruction
# that gets the agent back to a working command runner.
[[hooks]]
name = "permissiondenied-shell-denial-steer-py"
events = ["PermissionDenied", "PostToolUseFailure"]
command = ["/Users/zbornheimer/.agents/hooks/shell-denial-steer.py"]
timeout = "5s"
matcher = "Bash|sh|zsh|exec|shell|terminal|run_terminal_command"

[[hooks]]
name = "missing-tool-discovery"
description = "Auto-inject ToolSearch when a tool is denied or unavailable"
events = ["tool.denied", "tool.after"]
script = "~/.agents/hooks/missing-tool-discovery.py"
priority = 10
enabled = true

[[hooks]]
name = "escalation-budget"
description = "Prevent repeated user escalation without research"
events = ["tool.after"]
script = "~/.agents/hooks/escalation-budget.py"
priority = 20
enabled = true
filter = "ask|decision"

[[hooks]]
name = "grep-binary-detect"
description = "Detect binary/encrypted content in Grep results and warn agent"
events = ["tool.after"]
script = "~/.agents/hooks/grep-binary-detect.py"
timeout = "5s"
matcher = "Grep"
enabled = true

[[hooks]]
name = "grep-self-referential-suppress"
description = "Suppress self-referential Grep results where current session appears in history"
events = ["tool.after"]
script = "~/.agents/hooks/grep-self-referential-suppress.py"
timeout = "5s"
matcher = "Grep"
enabled = true

[[hooks]]
name = "stop-agentmux-board-wake"
events = ["turn.stop", "session.start"]
command = ["/Users/zbornheimer/.agents/hooks/board-wake.sh"]
async = true
timeout = "75s"

[[hooks]]
name = "userpromptsubmit-frustration-learn"
events = ["prompt.submit"]
command = ["/Users/zbornheimer/.agents/hooks/frustration-learn.py"]
timeout = "5s"
on_failure = "warn"
